<style>
/* ================= tokens ================= */
:root{
 --f-display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
 --f-body:'Figtree',system-ui,-apple-system,sans-serif;
 --f-mono:'Martian Mono',ui-monospace,Menlo,monospace;
 --ease:cubic-bezier(.32,.72,0,1);
 --spring:cubic-bezier(.34,1.3,.5,1);
 --c-health:#46C99B;--c-career:#6B9BFF;--c-family:#FF8C6B;--c-faith:#F0C862;--c-finance:#A9D14A;--c-learning:#AC93FF;--c-personal:#F585B8;
 --on-color:#0B1020;--ink-64:rgba(11,16,32,.64);--ink-16:rgba(11,16,32,.16);
}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.009,.037 1.7%,.153 3.6%,.776 10.3%,1.001 13.7%,1.117 16.9%,1.144 18.4%,1.137 20.6%,1.031 27.4%,.988 32.4%,.981 35.7%,.998 44.6%,1.004 50.1%,1)}}
[data-theme=night]{color-scheme:dark;--bg:#0A0F1F;--bg-2:#0F1528;--surface:#141B32;--surface-2:#1B2340;--line:rgba(200,210,240,.08);--line-2:rgba(200,210,240,.17);--text:#ECEAE3;--muted:#8F96AC;--dim:#4F5876;--accent:#FFB547;--on-accent:#1B1300;--stars:1;--glow:rgba(255,181,71,.07)}
[data-theme=space]{color-scheme:dark;--bg:#000;--bg-2:#06070B;--surface:#0D0F15;--surface-2:#141720;--line:rgba(220,225,240,.08);--line-2:rgba(220,225,240,.16);--text:#F2F2F0;--muted:#8A8F9C;--dim:#474C58;--accent:#9EE6D0;--on-accent:#04110D;--stars:1;--glow:rgba(158,230,208,.05)}
[data-theme=dusk]{color-scheme:dark;--bg:#160E21;--bg-2:#1B122A;--surface:#221734;--surface-2:#2B1F42;--line:rgba(240,215,240,.08);--line-2:rgba(240,215,240,.17);--text:#F4EBF1;--muted:#A897B4;--dim:#5E4E6E;--accent:#FF9E7A;--on-accent:#2A0E04;--stars:.65;--glow:rgba(255,158,122,.08)}
[data-theme=graphite]{color-scheme:dark;--bg:#151719;--bg-2:#1A1C1F;--surface:#1F2226;--surface-2:#272A2F;--line:rgba(230,232,236,.07);--line-2:rgba(230,232,236,.15);--text:#E8E9EB;--muted:#8E939B;--dim:#50555D;--accent:#E8E9EB;--on-accent:#151719;--stars:0;--glow:transparent}

[data-theme=ocean]{color-scheme:dark;--bg:#061420;--bg-2:#091A29;--surface:#0E2234;--surface-2:#142B41;--line:rgba(210,232,248,.08);--line-2:rgba(210,232,248,.17);--text:#E6F1F8;--muted:#8DA6BA;--dim:#476075;--accent:#4FD1E8;--on-accent:#03161B;--stars:.7;--glow:rgba(79,209,232,.07)}
[data-theme=mocha]{color-scheme:dark;--bg:#16100D;--bg-2:#1B1411;--surface:#231A16;--surface-2:#2D221D;--line:rgba(242,226,212,.08);--line-2:rgba(242,226,212,.17);--text:#F2E8DF;--muted:#AE9C8E;--dim:#65564B;--accent:#E8A86B;--on-accent:#241204;--stars:.3;--glow:rgba(232,168,107,.07)}

[data-theme=paper]{color-scheme:light;--bg:#F4EFE6;--bg-2:#ECE5D8;--surface:#FFFCF6;--surface-2:#F8F2E8;--line:rgba(60,40,20,.09);--line-2:rgba(60,40,20,.18);--text:#2A2118;--muted:#6B5F51;--dim:#B3A691;--accent:#B04A17;--on-accent:#fff;--stars:0;--glow:rgba(176,74,23,.06);--mo:#EDB892}

/* ================= base ================= */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--f-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;transition:background-color .6s var(--ease),color .6s var(--ease)}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(1100px 640px at 80% -14%,var(--glow),transparent 62%)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:var(--stars);transition:opacity .8s var(--ease)}
#stars i{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%}
#stars .s2{width:2px;height:2px}
#stars .tw{animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
#stars b{position:absolute;top:12%;left:-10%;width:130px;height:1px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:comet 22s linear infinite 8s}
@keyframes comet{0%{transform:translate(0,0) rotate(20deg);opacity:0}1.5%{opacity:.8}7%{transform:translate(70vw,26vw) rotate(20deg);opacity:0}100%{opacity:0}}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--on-accent)}
.data{font:500 10.5px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px;line-height:1.55}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ico-s{width:13px;height:13px;vertical-align:-2px;flex:none}
.hide{display:none!important}

/* ================= shell ================= */
#app{display:grid;grid-template-columns:96px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(24px + var(--sat,0px)) 0 20px;border-right:1px solid var(--line)}
.rail>a{margin-bottom:28px}
.logo{width:38px;height:38px;display:block}
.navs{position:relative;display:flex;flex-direction:column;gap:4px}
.nav{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;padding:10px 0 9px;border-radius:18px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;transition:color .35s var(--ease)}
.nav svg{width:22px;height:22px;transition:transform .5s var(--spring)}
.nav:hover{color:var(--text)}
.nav:active svg{transform:scale(.84)}
.nav.on{color:var(--text)}
.nav.on svg{color:var(--accent)}
.nav-ind{position:absolute;left:0;top:0;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);pointer-events:none;z-index:0;transition:transform .6s var(--spring),width .6s var(--spring),height .6s var(--spring),opacity .3s}
.rail .spacer{flex:1}
main{--gutter:clamp(18px,4vw,56px);min-width:0;width:100%;max-width:1120px;margin:0 auto;padding:calc(44px + var(--sat,0px)) var(--gutter) 150px}
.tabbar{display:none}
.mob{display:none!important}
@media(max-width:820px){
 #app{grid-template-columns:1fr}.rail{display:none}
 .tabbar{display:block;position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sab,env(safe-area-inset-bottom)));z-index:40;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--bg-2) 80%,transparent);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--line-2);box-shadow:0 20px 50px -14px rgba(0,0,0,.55)}
 .tabbar .navs{flex-direction:row;gap:0}
 .tabbar .nav{flex:1;width:auto;font-size:10px;padding:8px 0 7px;border-radius:20px}
 .tabbar .nav-ind{border-radius:20px}
 main{--gutter:16px;padding:calc(24px + var(--sat,0px)) 16px calc(130px + var(--sab,0px))}
 .mob{display:grid!important}
}

/* ================= type & header ================= */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:30px}
.ph h1{font:800 clamp(40px,7.4vw,74px)/.88 var(--f-display);text-transform:uppercase;letter-spacing:.004em}
.ph p{color:var(--muted);margin-top:12px;max-width:520px}
.ph .data{margin-top:14px}
.ph-r{display:flex;gap:8px;flex:none}
@media(max-width:560px){.ph{flex-wrap:wrap}.ph>div:first-child{flex:1 1 140px;min-width:0}.ph-r{flex-wrap:wrap;justify-content:flex-end;margin-left:auto;max-width:100%}}
.st-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:44px 0 14px}
.st-h h3{font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.crumb{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}

/* ================= controls ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:600 14.5px var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .5s var(--spring),background-color .25s,border-color .25s,color .25s}
.btn:hover{border-color:color-mix(in srgb,var(--text) 32%,transparent)}
.btn:active{transform:scale(.95);transition-duration:.15s}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:#FF7A7A}
[data-mode=light] :is(.btn.danger,.due.over){color:#C9302C}
[data-mode=light] .hfl{color:color-mix(in srgb,var(--c) 50%,#0B1020)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.ink{background:var(--t-fg,var(--on-color));color:var(--t-inv,#F4F2EC);border-color:transparent}
.btn.inkline{background:transparent;color:var(--t-fg,var(--on-color));border-color:color-mix(in srgb,var(--t-fg,#0B1020) 28%,transparent)}
.btn.inkline:hover{border-color:color-mix(in srgb,var(--t-fg,#0B1020) 60%,transparent)}
.btn svg{width:18px;height:18px}
.ibtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;flex:none;transition:transform .5s var(--spring),border-color .2s,color .2s}
.ibtn:hover{border-color:var(--line-2)}
.ibtn:active{transform:scale(.88);transition-duration:.15s}
.ibtn svg{width:20px;height:20px}
.ibtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.ibtn.sm{width:38px;height:38px;border-radius:12px}
.ibtn.sm svg{width:17px;height:17px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}
.seg-c{position:relative;display:inline-flex;padding:4px;border-radius:15px;background:var(--surface);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg-c::-webkit-scrollbar{display:none}
.seg-c button{position:relative;z-index:1;border:0;background:none;padding:9px 15px;border-radius:11px;font:600 13.5px var(--f-body);color:var(--muted);cursor:pointer;transition:color .35s var(--ease);white-space:nowrap}
.seg-c button.on{color:var(--text)}
.seg-c .pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:11px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2),0 6px 16px -8px rgba(0,0,0,.45);transition:transform .6s var(--spring),width .6s var(--spring)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:600 13.5px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .45s var(--spring),background-color .2s,color .2s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.chip svg{width:15px;height:15px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .25s;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea{min-height:104px;resize:vertical;line-height:1.5}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select option{background:var(--bg-2);color:var(--text)}
input[type=date],input[type=time]{min-height:48px}
input[type=range]{padding:0;border:0;background:none;height:26px;box-shadow:none;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
input[type=checkbox]{width:auto}
.sel{width:auto;height:46px;padding:0 38px 0 14px;font-size:14px;font-weight:600;border-radius:15px;border-color:var(--line)}
.field{margin-bottom:16px}
.field>label,.lbl{display:block;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr;gap:0}}
.radios{display:flex;gap:6px}
.radios label{flex:1;position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:block;text-align:center;padding:12px 2px;border-radius:13px;border:1px solid var(--line-2);cursor:pointer;font-weight:600;font-size:14px;transition:background-color .25s,color .25s}
.radios input:checked+span{background:var(--text);color:var(--bg);border-color:transparent}
.radios input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.radios.sm span{padding:9px 0;font-size:12.5px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.actions.left{justify-content:flex-start}
.sw{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;cursor:pointer;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{position:relative;width:50px;height:30px;border-radius:30px;background:var(--line-2);transition:background-color .35s var(--ease);flex:none}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .55s var(--spring)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.sw small{display:block;color:var(--muted);font-size:13px}

/* ================= colored surfaces ================= */
.tint{--t-bg:var(--c);--t-fg:#0B1020;--t-mut:rgba(11,16,32,.64);--t-bd:transparent;--t-sh:none;--t-num:var(--t-fg);--t-numsh:none;--t-stroke:0 transparent;--t-bar:#0B1020;--t-barbg:rgba(11,16,32,.16);--t-barsh:none;--t-inv:#F4F2EC;--t-ring:rgba(11,16,32,.13);--t-moon:rgba(11,16,32,.24);--t-blur:none;
 background:var(--t-bg);color:var(--t-fg);border:1px solid var(--t-bd);box-shadow:var(--t-sh);-webkit-backdrop-filter:var(--t-blur);backdrop-filter:var(--t-blur);position:relative;overflow:hidden;isolation:isolate}
.tint .data{color:var(--t-mut)}
.tint::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:var(--t-fg);opacity:0;-webkit-mask:var(--pat,none) repeat;mask:var(--pat,none) repeat;-webkit-mask-size:var(--pat-s,24px);mask-size:var(--pat-s,24px)}
.tint::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:var(--img,none) center/cover no-repeat}
:is(.sc-back,.jf-back).tint::before{box-shadow:inset 0 0 0 2000px var(--t-dim,transparent)}
.pbar{height:4px;border-radius:4px;background:var(--line-2);overflow:hidden}

/* ================= today ================= */

.now-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.list{border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background-color .25s}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.li .s i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.due.over{color:#FF7A7A}.due.soon{color:var(--accent)}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);background:none;display:grid;place-items:center;color:transparent;cursor:pointer;transition:transform .5s var(--spring),background-color .25s,border-color .25s}

.mini{scroll-snap-align:start;flex:none;width:210px;height:156px;border-radius:24px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;transition:transform .55s var(--spring)}
.mini:active{transform:scale(.96)}
.mini .t{font-weight:700;font-size:16px;line-height:1.25;margin-bottom:12px}

/* ================= goal flip cards ================= */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr 1fr;gap:10px}}
.fc{perspective:1400px;height:264px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .6s var(--spring)}

.fc-in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .9s var(--spring)}

.fc-face{position:absolute;inset:0;border-radius:26px;padding:18px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden}

.fc-top .data{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.fc-n{font:800 88px/.78 var(--f-display);margin-top:auto;letter-spacing:-.01em}
.fc-t{font-weight:700;font-size:17px;line-height:1.25;margin:12px 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-p{margin-top:8px}
@media(max-width:560px){.fc-n{font-size:66px}.fc-t{font-size:15px;margin:10px 0 12px}.fc-face{padding:15px;border-radius:22px}}
.fc.done .fc-front{filter:saturate(.35) brightness(.86)}
.fc-back{transform:rotateY(180deg);background:var(--surface-2);border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));gap:10px}
.fc-back .bt{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px;line-height:1.25}

.fc-back .nx{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kv{display:flex;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}

.fc-act{display:flex;gap:8px;margin-top:auto}
.fc-act .btn{flex:1}

.fc-back>*{flex:none;min-width:0}.fc-back .bt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.fc-act{flex:none}

/* ================= goal hero ================= */
.hero{border-radius:34px;padding:clamp(22px,4.4vw,40px);margin-bottom:26px}

.hero .why{font-size:16.5px;line-height:1.5;max-width:52ch;opacity:.82}
.hero-f{display:flex;align-items:flex-end;gap:22px;margin-top:30px}

@media(max-width:560px){.hero-pct{font-size:58px}.hero{border-radius:28px}}
.gchip{display:inline-flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px;margin:0 8px 8px 0;transition:transform .5s var(--spring),border-color .2s}

.gchip:active{transform:scale(.95)}
.gchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.gchip span{color:var(--muted);font:500 10.5px var(--f-mono)}

/* ================= flight-path spine ================= */
.spine{position:relative;padding:14px 0 10px}
.spine::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:repeating-linear-gradient(var(--line-2) 0 4px,transparent 4px 11px)}
.spine-fill{position:absolute;left:50%;top:0;width:2px;margin-left:-1px;height:0;background:var(--c);border-radius:2px;transition:height 1.2s var(--ease);box-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.sp-item{position:relative;display:grid;grid-template-columns:1fr 76px 1fr;align-items:center}
.sp-item+.sp-item{margin-top:-26px}
.sp-card{grid-row:1;min-width:0;position:relative}
.sp-item.l .sp-card{grid-column:1}
.sp-item.r .sp-card{grid-column:3}
.sp-item>.node,.sp-item>.jdot{grid-row:1;grid-column:2;justify-self:center}
.sp-card::after{content:'';position:absolute;top:50%;width:21px;height:2px;margin-top:-1px;background:var(--c,var(--line-2));opacity:.55}
.sp-item.l .sp-card::after{right:-21px}
.sp-item.r .sp-card::after{left:-21px}
.node{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 75%,transparent);background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,var(--bg)) 0,var(--bg) 72%);box-shadow:0 0 12px -3px color-mix(in srgb,var(--c) 75%,transparent);display:grid;place-items:center;color:#0B1020;cursor:pointer;flex:none;transition:transform .55s var(--spring),box-shadow .3s}
.node.static{cursor:default}
.node:hover{transform:scale(1.1)}
.node:active{transform:scale(.85)}
.node svg{width:16px;height:16px;stroke-width:3}
:is(.sp-item,.hs-item).done .node{background:radial-gradient(circle at 38% 32%,#fff 0,var(--c) 44%,color-mix(in srgb,var(--c) 55%,#000) 100%);border-color:transparent;box-shadow:0 0 12px var(--c),0 0 32px color-mix(in srgb,var(--c) 55%,transparent)}
:is(.sp-item,.hs-item).cur .node{animation:led 2.4s var(--ease) infinite}
@keyframes led{0%,100%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent),0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--c) 5%,transparent),0 0 30px var(--c)}}
.sp-date{position:relative;z-index:1;display:flex;justify-content:center;margin:26px 0 14px}
.sp-date span{background:var(--bg);border:1px solid var(--line-2);padding:5px 14px;border-radius:999px}
.sp-date+.sp-item{margin-top:0}
.jdot{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0,var(--c,var(--muted)) 50%);box-shadow:0 0 10px var(--c,transparent),0 0 22px color-mix(in srgb,var(--c,transparent) 50%,transparent)}
@media(max-width:620px){
 .sp-item{grid-template-columns:1fr 46px 1fr}
 .sp-item+.sp-item{margin-top:-22px}
 .sp-card::after{width:10px}.sp-item.l .sp-card::after{right:-10px}.sp-item.r .sp-card::after{left:-10px}
 .node{width:28px;height:28px}.node svg{width:13px;height:13px}
}
/* step flip card */
.sc{perspective:1200px;cursor:pointer;-webkit-user-select:none;user-select:none}
.sc-in{display:grid;transform-style:preserve-3d;transition:transform .85s var(--spring)}
.sc.flip .sc-in{transform:rotateY(180deg)}
.sc-face{grid-area:1/1;border-radius:22px;padding:16px 18px;-webkit-backface-visibility:hidden;backface-visibility:hidden;min-height:118px;display:flex;flex-direction:column}
.sc-n{font:800 40px/.8 var(--f-display)}
.sc-t{font-weight:700;font-size:15.5px;line-height:1.28;margin:10px 0 8px}
.sc:not(.big) .sc-front>.data{margin-top:auto;display:flex;gap:6px;align-items:center}
:is(.sp-item,.hs-item).done .sc-front{filter:saturate(.3) brightness(.8)}
:is(.sp-item,.hs-item).done .sc-t{text-decoration:line-through;text-decoration-thickness:2px}
:is(.sp-item,.hs-item).cur .sc-front{box-shadow:var(--t-sh),0 26px 60px -24px color-mix(in srgb,var(--c) 90%,transparent)}
.sc-back{transform:rotateY(180deg);background:var(--surface-2);border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));gap:8px}
.sc-back .note{font-size:13.5px;line-height:1.45;color:var(--muted)}
.sc-back.tint .note{color:var(--t-mut)}
.sc-back .kv:first-child{border-top:0;padding-top:0}
.sc-act{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.sc-act .btn{flex:1;padding:0 10px}
@media(max-width:620px){.sc-face{padding:13px 13px;border-radius:18px;min-height:108px}.sc-n{font-size:32px}.sc-t{font-size:14px}.sc-act .btn span{display:none}}
.add-step{display:flex;justify-content:center;margin-top:18px;position:relative;z-index:1}
/* journal card */
.jc{border-radius:20px;padding:15px 17px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--line-2))}
.jc.tint{border:0}
.jc .jh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.jc .jt{line-height:1.45;font-size:14.5px}
.jc .jg{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--muted)}
.jc.tint .jg{color:var(--ink-64)}
.jc img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:13px;margin-top:10px}
.jc .x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;padding:2px;display:grid}

@media(max-width:620px){.jc{padding:12px 13px}.jc .jt{font-size:13.5px}.jc.big .jt{font-size:21px}}

/* ================= reveal ================= */
.rv{opacity:0;transform:translateY(26px) scale(.985);transition:opacity .8s var(--ease),transform 1s var(--ease)}
.sp-item.l.rv{transform:translateX(-26px)}
.sp-item.r.rv{transform:translateX(26px)}
.rv.in,.sp-item.l.rv.in,.sp-item.r.rv.in{opacity:1;transform:none}

/* ================= empty ================= */
.empty{text-align:center;padding:52px 24px;border:1.5px dashed var(--line-2);border-radius:28px}
.empty h3{font:800 34px/.95 var(--f-display);text-transform:uppercase;margin:0 auto 12px;max-width:16ch}
.empty p{color:var(--muted);max-width:420px;margin:0 auto}
.empty .actions{justify-content:center}

/* ================= timeline (flowing tracks) ================= */
.road{position:relative;overflow-x:auto;overflow-y:hidden;--lab:0px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:0 calc(-1 * var(--gutter));-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--gutter),#000 calc(100% - var(--gutter)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--gutter),#000 calc(100% - var(--gutter)),transparent)}
.road::-webkit-scrollbar{display:none}
.road-in{position:relative;box-sizing:content-box;padding:0 var(--gutter) 22px}
.fl-ax{position:relative;height:44px}
.fl-tk{position:absolute;top:12px;padding-left:10px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.fl-tk::before{content:'';position:absolute;left:0;top:5px;width:4px;height:4px;border-radius:50%;background:var(--dim)}
.fl-tk.yr{color:var(--text)}
.fl-tk.wk{top:14px;padding-left:0;font-size:9.5px;color:var(--dim);transform:translateX(-50%)}
.fl-tk.wk::before{display:none}
.fl-row{position:relative}
.fl-row>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.fl-base{fill:none;stroke:var(--c);stroke-opacity:.2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:stroke-opacity .3s}
.fl-prog{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 75%,transparent))}
.fl-hit{fill:none;stroke:transparent;stroke-width:28;pointer-events:stroke;cursor:pointer}
.fl-row:hover .fl-base{stroke-opacity:.34}
.fl-row.halo .fl-prog{filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 calc(var(--hr) * .4) color-mix(in srgb,var(--c) var(--ha),transparent))}
.fl-row.halo .fl-base{stroke-opacity:.3}
.fl-dot,.fl-end,.fl-ship,.fl-st{position:absolute;border-radius:50%;pointer-events:none}
.fl-dot{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--c);box-shadow:0 0 10px var(--c)}
.fl-end{width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid var(--c);background:var(--bg);box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent)}
.fl-st{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:var(--bg);box-shadow:0 0 0 1.5px var(--c)}
.fl-st.d{background:var(--c)}
.fl-ship{width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent),0 0 18px var(--c)}
.fl-ship::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--c);animation:flping 2.6s var(--ease) infinite}
@keyframes flping{from{transform:scale(.35);opacity:.9}to{transform:scale(1.7);opacity:0}}
.fl-chip{position:sticky;left:var(--gutter);z-index:3;display:inline-flex;align-items:center;gap:10px;max-width:min(340px,74vw);margin-top:6px;padding:6px 14px 6px 7px;border-radius:999px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);cursor:pointer;transition:border-color .3s,background-color .3s}
.fl-chip:hover{border-color:var(--line-2)}
.fl-row.open .fl-chip{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.fl-chip .pr{flex:none;width:28px;height:28px;transform:rotate(-90deg)}
.fl-chip .pr circle{fill:none;stroke-width:3.5}
.fl-chip .pr .a{stroke:color-mix(in srgb,var(--c) 22%,transparent)}
.fl-chip .pr .b{stroke:var(--c);stroke-linecap:round}
.fl-chip .tx{min-width:0}
.fl-chip b{display:block;font:700 15px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-chip .data{display:block;font-size:9.5px;margin-top:3px;white-space:nowrap}
.fl-chip .link{flex:none;font-size:12.5px;margin-left:2px}
.today-line{position:absolute;top:36px;bottom:14px;width:2px;margin-left:-1px;z-index:2;pointer-events:none}

#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}

.mapcard{position:absolute;left:12px;right:12px;bottom:66px;margin:0 auto;max-width:440px;display:flex;gap:14px;align-items:center;padding:12px 12px 12px 18px;border-radius:22px;animation:cardup .6s var(--spring)}

.pv{display:flex;gap:14px;padding:16px;border-radius:20px;border:1px solid var(--line);margin-top:10px;cursor:pointer;background:var(--surface);transition:border-color .25s}

 .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:32px 32px 0 0;opacity:1;transform:translateY(105%);padding:12px 20px calc(24px + var(--sab,env(safe-area-inset-bottom)));transition:transform .5s var(--ease),visibility 0s .5s}
 .sheet.on{transform:none;transition:transform .6s var(--ease),visibility 0s}

 .sheet h2{font-size:30px}
}
.menu button{display:flex;gap:14px;align-items:center;width:100%;padding:15px 12px;border-radius:14px;background:none;border:0;font-size:15.5px;font-weight:500;cursor:pointer;text-align:left;transition:background-color .2s}

.tev{position:absolute;min-width:0;display:flex;gap:7px;align-items:flex-start;padding:5px 8px 5px 10px;border-radius:10px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 22%,var(--bg-2));box-shadow:inset 3px 0 0 var(--c);transition:filter .2s,transform .4s var(--spring);animation:pop .5s var(--spring) both;z-index:1}

.tnow{position:absolute;left:-6px;right:0;height:2px;margin-top:-1px;background:#FF5A5F;z-index:3;pointer-events:none;box-shadow:0 0 10px rgba(255,90,95,.6)}
.tnow::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#FF5A5F}
.tghost{position:absolute;left:0;right:0;border-radius:10px;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;display:none;z-index:0}
.dgrid.pinch .tev{transition:none}

/* ================= pull down to sync ================= */
html,body{overscroll-behavior-y:contain}
#ptr{position:fixed;top:calc(-48px + var(--sat,env(safe-area-inset-top)));left:50%;z-index:70;width:44px;height:44px;border-radius:50%;background:var(--surface-2);box-shadow:0 10px 26px -8px rgba(0,0,0,.55),inset 0 0 0 1px var(--line-2);display:grid;place-items:center;color:var(--accent);transform:translate(-50%,0);opacity:0;pointer-events:none;transition:transform .4s var(--spring),opacity .25s,background-color .2s,color .2s}
#ptr.on{opacity:1;transition:opacity .15s,background-color .2s,color .2s}
#ptr.spin{transition:transform .4s var(--spring),opacity .25s}
#ptr .rg{position:absolute;inset:3px;width:38px;height:38px;transform:rotate(-90deg)}
#ptr .rg circle{fill:none;stroke-width:3}
#ptr .rg .t{stroke:var(--line-2)}
#ptr .rg .a{stroke:currentColor;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0) * 100)}
#ptr .ico{width:18px;height:18px}
#ptr.ready{background:var(--accent);color:var(--on-accent)}
#ptr.spin .ico{animation:ptrspin .8s linear infinite}
#ptr.spin .rg{opacity:0}
@keyframes ptrspin{to{transform:rotate(360deg)}}

/* ================= page transitions ================= */
::view-transition-old(root){animation:vt-out .32s var(--ease) both}
::view-transition-new(root){animation:vt-in .55s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:scale(.985)}}
@keyframes vt-in{from{opacity:0;transform:translateY(16px)}}
::view-transition-group(hero){animation-duration:.6s;animation-timing-function:var(--ease)}
::view-transition-old(hero),::view-transition-new(hero){animation-duration:.6s;height:100%;object-fit:cover}
[data-motion=reduced] *,[data-motion=reduced] *::before,[data-motion=reduced] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.rp h2{text-align:center;text-wrap:balance}
.rp-steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rp-steps span{width:26px;height:6px;border-radius:6px;background:var(--line-2);transition:background-color .3s}
.rp-steps span.d{background:var(--c)}
.rp-steps span.c{background:var(--text)}
.rp-a{justify-content:center}
/* urge surfing */
.breath{position:relative;width:190px;height:190px;margin:18px auto 8px;display:grid;place-items:center}
.breath i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 60%,transparent),color-mix(in srgb,var(--c) 10%,transparent) 70%);box-shadow:0 0 60px -10px var(--c);animation:breathe 10s cubic-bezier(.45,0,.55,1) infinite;transform:scale(.5)}
@keyframes breathe{0%{transform:scale(.5)}40%{transform:scale(1)}55%{transform:scale(1)}100%{transform:scale(.5)}}
.breath span{position:relative;font:700 17px var(--f-body)}
.hwhy{margin-top:12px;padding:12px 16px;border-left:3px solid var(--c,var(--accent));background:var(--surface);border-radius:4px 14px 14px 4px;font-size:14.5px}
.hwhy .data{display:block;margin-bottom:2px}
.node.sub{border-style:dashed}
.node.sub i{display:block;width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 18%,transparent) 0)}
.subc .sc-front .nbadge small{font-size:.5em}
.add-step{gap:10px;flex-wrap:wrap}
/* ================= guided tour ================= */
.tour{position:fixed;inset:0;z-index:90;pointer-events:none}
.tblock{position:absolute;inset:0;pointer-events:auto}
.tdim{position:fixed;inset:0;background:rgba(3,5,12,.7);pointer-events:none;contain:strict}
[data-mode=light] .tdim{background:rgba(10,16,34,.55)}
.tspot{position:fixed;left:0;top:0;border-radius:18px;border:2px solid var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent);pointer-events:none;opacity:0;transition:opacity .25s}
[data-touring] #view .rv{opacity:1!important;transform:none!important;transition:none!important}
[data-touring] .cal-body{animation:none!important}
[data-touring] main{scroll-behavior:auto}

.trcard{position:fixed;left:16px;top:16px;width:min(380px,calc(100vw - 24px));padding:18px 18px 14px;border-radius:24px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 20px 50px -20px rgba(0,0,0,.7);pointer-events:auto;transition:opacity .3s var(--ease),transform .5s var(--spring);will-change:opacity,transform}
.trcard.away{opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;transition:opacity .16s,transform .2s}
@media(max-width:820px){.trcard{padding:14px 16px 10px}.trcard h3{font-size:22px;margin:4px 0 6px}.trcard p{font-size:13.5px;line-height:1.45}.tc-a{margin-top:10px}}
.trcard.in{animation:tcin .5s var(--spring)}
@keyframes tcin{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:none}}
.trcard h3{font:800 26px/1 var(--f-display);text-transform:uppercase;margin:8px 0 8px}
.trcard p{font-size:14.5px;line-height:1.55;color:var(--muted)}
.tc-bar{height:3px;border-radius:3px;background:var(--line-2);margin-bottom:12px;overflow:hidden}
.tc-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s var(--ease)}
.tc-a{display:flex;align-items:center;gap:8px;margin-top:14px}
.tc-a .link{font-size:13px;color:var(--muted)}
.tbadge{position:fixed;top:calc(10px + var(--sat,env(safe-area-inset-top)));left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent)!important;font-size:10px}
.tfinger{position:fixed;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;transition:left .45s var(--ease),top .45s var(--ease),opacity .25s}
.tfinger.on{opacity:1}
.tfinger i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.22)}
.tfinger i+i{display:none}
.tfinger.tap i:first-child{animation:ttap 1.3s var(--ease) infinite}
.tfinger.tap i:first-child::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff;opacity:0;animation:tring 1.3s ease-out infinite}
@keyframes ttap{0%,100%{transform:scale(1)}35%{transform:scale(.72)}55%{transform:scale(1)}}
@keyframes tring{30%{opacity:0;transform:scale(.6)}40%{opacity:.9}100%{opacity:0;transform:scale(2.2)}}
.tfinger.swipe i:first-child{animation:tswipe 1.7s var(--ease) infinite}
@keyframes tswipe{0%{transform:translateX(70px);opacity:0}15%{opacity:1}75%{transform:translateX(-90px);opacity:1}100%{transform:translateX(-90px);opacity:0}}
.tfinger.pull i:first-child{animation:tpullf 1.8s var(--ease) infinite}
.tfinger.pinch i+i{display:block}
.tfinger.pinch i:first-child{animation:tpin1 1.8s var(--ease) infinite}
.tfinger.pinch i+i{animation:tpin2 1.8s var(--ease) infinite}
@keyframes tpin1{0%,100%{transform:translate(-14px,-14px)}50%{transform:translate(-60px,-60px)}}
@keyframes tpin2{0%,100%{transform:translate(14px,14px)}50%{transform:translate(60px,60px)}}
.tfinger.drag i:first-child{animation:tdrag 2.6s var(--ease) infinite}
@keyframes tdrag{0%{transform:translate(0,0) scale(1)}12%{transform:translate(0,0) scale(.8)}60%{transform:translate(110px,70px) scale(.8)}75%,100%{transform:translate(110px,70px) scale(1);opacity:.2}}
.tpull{position:relative;height:96px;margin:6px 0 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tpull::before{content:'';position:absolute;left:14px;right:14px;top:26px;height:10px;border-radius:5px;background:var(--line-2);box-shadow:0 20px 0 var(--line),0 40px 0 var(--line)}
.tpull i{position:absolute;left:50%;top:10px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.tpull span{position:absolute;left:50%;top:-30px;margin-left:-15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--line-2);color:var(--accent)}
.tpull span svg{width:16px;height:16px}
.tpull.go i{animation:tpullf 2s var(--ease) infinite}
.tpull.go span{animation:tpulls 2s var(--ease) infinite}
.tpull.go::before{animation:tpullc 2s var(--ease) infinite}
@keyframes tpullf{0%{transform:translateY(0);opacity:0}10%{opacity:1}60%{transform:translateY(46px)}80%,100%{transform:translateY(46px);opacity:0}}
@keyframes tpulls{0%,15%{transform:translateY(0) rotate(0)}60%{transform:translateY(40px) rotate(220deg)}85%{transform:translateY(40px) rotate(560deg)}100%{transform:translateY(0) rotate(560deg)}}
@keyframes tpullc{0%,15%{transform:none}60%,85%{transform:translateY(22px)}100%{transform:none}}
.twid{margin:6px 0 4px;padding:12px 14px;border-radius:20px;background:linear-gradient(315deg,#1A2346,#0C1226);border:1px solid rgba(200,210,240,.14);color:#ECEAE3}
.tw-h{display:flex;justify-content:space-between;font:700 10px var(--f-mono);letter-spacing:.12em;color:#FFB547;margin-bottom:6px}
.tw-h span{color:#ECEAE3}
.tw-r{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;animation:twr .5s var(--ease) both;animation-delay:calc(var(--k) * 120ms + 200ms)}
.tw-r em{flex:1;font-style:normal}
.tw-r i{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(200,210,240,.3);display:grid;place-items:center;font:700 9px var(--f-mono);font-style:normal}
.tw-r i.on{background:#46C99B;border-color:transparent;color:#0B1020;animation:twc .5s var(--spring) both;animation-delay:calc(var(--k) * 120ms + 700ms)}
.tw-r:nth-child(4) i{animation:twtap 2.4s var(--ease) 1.4s infinite}
@keyframes twr{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:none}}
@keyframes twc{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes twtap{0%,40%{background:transparent}50%,100%{background:#46C99B;border-color:transparent}}
.tprompt{position:fixed;z-index:80;left:50%;bottom:calc(96px + var(--sab,env(safe-area-inset-bottom)));width:min(460px,calc(100vw - 24px));display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;padding:16px 16px 12px;border-radius:24px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 30px 70px -20px rgba(0,0,0,.7);transform:translate(-50%,24px);opacity:0;transition:transform .55s var(--spring),opacity .35s}
.tprompt.on{transform:translate(-50%,0);opacity:1}
.tprompt .logo{width:40px;height:40px}
.tprompt b{display:block;font-size:15.5px}
.tprompt span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.tp-a{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
@media(min-width:821px){.tprompt{bottom:28px}}
/* map opening */
.m-grow .m-label,.m-grow .m-pct,.m-grow .m-area text{opacity:0}
.m-grown .m-label,.m-grown .m-pct,.m-grown .m-area text{animation:mfade .8s var(--ease) both}
@keyframes mfade{from{opacity:0}to{opacity:1}}
/* calendar fits the screen */
.cal-m{height:var(--calh,auto);grid-auto-rows:minmax(0,1fr)}
.cal-m .cd{min-height:0;overflow:hidden}
@media(min-width:821px){.cal-w{height:var(--calh,auto)}.cal-w .cw{min-height:0;overflow-y:auto;scrollbar-width:thin}}
@media(max-width:820px){.cal-m .cd{min-height:44px}}
@media(pointer:fine){.cal-card .cal-body{cursor:grab}.cal-card.cdrag .cal-body{cursor:grabbing;user-select:none}}
.cal-card.cdrag *{pointer-events:none}
/* journal */
.jdate{position:relative;overflow:hidden;cursor:pointer}
.jdate input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.jdate input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.jflag{position:fixed;z-index:70;left:50%;top:38%;display:grid;justify-items:center;padding:16px 26px;border-radius:24px;background:var(--accent);color:var(--on-accent);box-shadow:0 30px 70px -20px rgba(0,0,0,.6);pointer-events:none;animation:jflag 1.7s var(--ease) both}
.jflag b{font:800 44px/.9 var(--f-display);text-transform:uppercase}
.jflag span{font:500 11px var(--f-mono);letter-spacing:.1em}
@keyframes jflag{0%{opacity:0;transform:translate(-50%,30px) scale(.6) rotate(-6deg)}18%{opacity:1;transform:translate(-50%,0) scale(1.05) rotate(1deg)}30%{transform:translate(-50%,0) scale(1) rotate(0)}75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-50px) scale(.8)}}
.warp .hs-card,.warp .sp-card{filter:blur(2px) saturate(.6);transition:filter .3s}
.hs-item.jhit .hs-card,.sp-item.jhit .sp-card{animation:jhit 1.6s var(--spring)}
@keyframes jhit{0%{transform:scale(.92)}25%{transform:scale(1.06);filter:drop-shadow(0 0 26px var(--c))}60%{transform:scale(1);filter:drop-shadow(0 0 18px var(--c))}100%{filter:none}}
.jv-img{display:block;width:calc(100% + 56px);margin:-28px -28px 18px;max-height:52vh;object-fit:cover;border-radius:30px 30px 0 0}
@media(max-width:820px){.jv-img{width:calc(100% + 40px);margin:-4px -20px 16px;border-radius:24px 24px 0 0}}
.jv-t{margin-top:12px;white-space:pre-wrap;line-height:1.6}
.jv-link{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));display:grid;gap:6px}
.jv-link .t{font-weight:700;font-size:16px}
.jv-link .pbar{height:5px}
/* compact calendar header so the calendar fits on screen */
.ph.cph{margin-bottom:18px}
.ph.cph h1{font-size:clamp(36px,5.2vw,54px)}
.ph.cph .data{margin-top:8px}
@media(min-width:821px){.cal-body.dv{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:22px;align-items:center}.cal-body.dv>:nth-child(n+3){grid-column:1/-1}.cal-body.dv .cdh{margin:0}.cal-body.dv .dstrip{margin:0}}
/* ================= focus (full-screen) mode ================= */
:root[data-focus=on] #app{grid-template-columns:1fr}
:root[data-focus=on] .rail,:root[data-focus=on] .tabbar,:root[data-focus=on] .fsb,:root[data-focus=on] .gearb{display:none!important}
:root[data-focus=on] main{max-width:1500px;padding:14px var(--gutter) 40px}
:root[data-focus=on] .ph{margin-bottom:14px;justify-content:flex-end;min-height:46px}
:root[data-focus=on] .ph>div:first-child{display:none}
:root[data-focus=on] .ph.cph{margin-bottom:14px}
:root[data-focus=on] .crumb{margin-top:58px}
:root[data-focus=on] .mapwrap{position:fixed;inset:0;height:auto;min-height:0;border-radius:0;border:0;z-index:30}
:root[data-focus=on] .mapctl{top:calc(12px + var(--sat,env(safe-area-inset-top)))}
:root[data-focus=on] .mapdock{bottom:calc(12px + var(--sab,env(safe-area-inset-bottom)))}
:root[data-focus=on] .st-h:first-child{margin-top:8px}
:root[data-focus=on] .toast{top:auto;bottom:calc(20px + var(--sab,env(safe-area-inset-bottom)));transform:translate(-50%,160%)}
:root[data-focus=on] .toast.on{transform:translate(-50%,0)}
:root[data-focus=on] .tprompt{bottom:24px}
#fnav{transition:transform .45s var(--ease),opacity .3s;position:fixed;z-index:55;left:max(12px,env(safe-area-inset-left));top:calc(12px + var(--sat,env(safe-area-inset-top)))}
.fn-t{display:flex;align-items:center;gap:9px;height:46px;padding:0 14px 0 13px;border-radius:23px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--bg-2) 78%,transparent);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);color:var(--text);font:600 14px var(--f-body);cursor:pointer;box-shadow:0 14px 34px -14px rgba(0,0,0,.6);transition:transform .45s var(--spring)}

#fnav.open .fn-t .fn-m{transform:rotate(90deg)}
.fn-p{position:absolute;left:0;top:54px;width:min(300px,calc(100vw - 24px));display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-radius:24px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 30px 70px -20px rgba(0,0,0,.7);transform-origin:22px -10px;transform:scale(.6);opacity:0;visibility:hidden;transition:transform .5s var(--spring),opacity .25s,visibility 0s .5s}
#fnav.open .fn-p{transform:none;opacity:1;visibility:visible;transition:transform .5s var(--spring),opacity .25s}
.fn-i,.fn-x{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:15px;text-decoration:none;color:var(--text);font:600 14px var(--f-body);border:0;background:none;cursor:pointer;opacity:0;transform:translateY(-6px)}
#fnav.open .fn-i,#fnav.open .fn-x{animation:fnin .45s var(--spring) both;animation-delay:calc(var(--n) * 28ms + 60ms)}

.fn-i.on{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.fn-i svg,.fn-x svg{width:19px;height:19px;color:var(--muted)}
.fn-i.on svg{color:var(--accent)}
.fn-x{grid-column:1/-1;justify-content:center;margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 15px 15px;color:var(--muted)}
@media(max-width:820px){.fn-t span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
#fnav.hid{transform:translateY(-80px);opacity:0}
@media(max-width:400px){.ph-r{gap:6px}.ph-r .ibtn{width:40px;height:40px;border-radius:13px}.ph-r .ibtn svg{width:18px;height:18px}.ph-r .btn{height:40px;padding:0 12px}}
/* ================= writing ================= */
@media(min-width:821px){.sheet.wsheet{width:min(720px,calc(100vw - 32px));max-height:92vh}}
@media(max-width:820px){.sheet.wsheet{max-height:96vh}}

.jmood{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:14px;background:color-mix(in srgb,var(--t-fg) 12%,transparent);font-size:22px;margin-top:10px}

.ms-row{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}

@media(max-width:700px){.hvista{border-radius:26px;margin-inline:-4px}.hv-hero{padding:0 16px}.hv-bar2{padding:14px 14px 2px}.hv-span button{padding:7px 10px;font-size:12px}.hv-lane{padding:12px 18px 0}.hv-bg i{left:8px;right:8px}#hvrng{width:100%;margin-left:4px;order:2}}

/* notifications settings */

.sc-face{position:relative}
.hrow .bell.ic{margin-right:2px}
.rm-sw{margin:6px 0 4px;border-top:0}

/* snoozes, quiet history, own-emoji icon */

.rm-snz>svg{width:20px;height:20px;flex:none;color:var(--accent)}.rm-snz>div{flex:1;min-width:0}.rm-snz b{display:block;font-size:14px}.rm-snz small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.sh-what{display:flex;gap:12px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--bg-2);border:1px dashed var(--line-2)}.sh-what>svg{width:18px;height:18px;color:var(--muted);flex:none;margin-top:2px}.sh-what b{display:block;font-size:13.5px}.sh-what small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.sh-asg{margin-top:12px}.sh-asg summary{cursor:pointer;color:var(--muted)}.sh-st{display:flex;align-items:center;gap:10px;margin-top:8px}.sh-st span{flex:1;min-width:0;font-size:14px}.sh-st input{width:48%;padding:8px 10px}
.sh-steps{display:grid;gap:4px;margin-top:10px}.sh-steps>div{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 2px}.sh-steps i{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}.sh-steps .d i{background:var(--accent)}.sh-steps .me span{font-weight:600}.sh-steps span{flex:1;min-width:0}.sh-steps em{font-style:normal;font:500 11px var(--f-mono);color:var(--muted)}
.sh-tot{margin:10px 0 4px}.sh-tot b{font:800 44px/1 var(--f-display)}.sh-tot span{display:block;color:var(--muted);font-size:13px}
.sh-ms{display:grid;gap:8px;margin-top:12px}.sh-mr{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg-2)}.sh-mr>div{flex:1;min-width:0}.sh-mr b{display:block;font-size:14px}.sh-mr small{display:block;color:var(--muted);font-size:12px}
.sh-mr.me{border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}.sh-mr.pend{opacity:.6}
.sh-wk{display:flex;gap:4px;margin-top:6px}.sh-wk i{width:16px;height:6px;border-radius:3px;background:var(--line-2)}.sh-wk i.on{background:var(--accent)}
.sh-mr .pbar{margin-top:6px}.sh-ch{font-size:16px}
.sh-chip{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:2px 8px;border-radius:999px;border:0;background:color-mix(in srgb,var(--text) 10%,transparent);color:inherit;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;vertical-align:1px}
.sh-how{margin:12px 0 0 18px;display:grid;gap:10px;font-size:14px;line-height:1.5;color:var(--muted)}.sh-how b{color:var(--text)}
/* reactions */
.rx-go{flex:none;gap:6px;padding:0 12px}.rx-go span{font-size:15px}
.rx-emo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}

.rx-b:active{transform:scale(.88)}.rx-b:hover{background:var(--surface-2)}.rx-b:disabled,.rx-m:disabled{opacity:.4;cursor:default}
.rx-msgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rx-m{padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:500 14px var(--f-body);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rx-left{margin-top:12px}
.rx-qf{display:grid;gap:8px;margin-top:12px}
.rx-feed{margin-top:14px;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--accent) 8%,var(--bg-2));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.rx-i{display:flex;align-items:center;gap:10px;padding:7px 0}.rx-i+.rx-i{border-top:1px solid var(--line)}
.rx-ie{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--surface)}
.rx-it{flex:1;min-width:0;font-size:13.5px}.rx-it b{display:block;font-size:13px}.rx-it span{display:block;color:var(--text);overflow-wrap:anywhere}
.rx-i small{flex:none;color:var(--muted);font:500 11px var(--f-mono)}.rx-i.out{opacity:.78}
.rx-none{margin-top:12px}
.rx-ava{background:color-mix(in srgb,var(--accent) 16%,var(--surface));font-size:18px}
.sh-chip{position:relative}.sh-chip.new{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.sh-dot{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:2px;border-radius:999px;background:var(--accent);color:var(--on-accent,#0B1020);font:700 10px/1 var(--f-body);font-style:normal;letter-spacing:0;animation:rxPop .5s var(--spring)}
.rxb{position:fixed;z-index:95;left:50%;top:calc(10px + var(--sat,env(safe-area-inset-top)));width:min(520px,calc(100% - 24px));display:flex;align-items:center;gap:8px;padding:8px 8px 8px 8px;border-radius:22px;background:var(--surface);color:var(--text);border:1.5px solid var(--accent);box-shadow:0 18px 50px -10px rgba(0,0,0,.55),0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);transform:translate(-50%,-160%);opacity:0;visibility:hidden;transition:transform .55s var(--spring),opacity .3s,visibility 0s .55s}
.rxb.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .55s var(--spring),opacity .3s}
.rxb-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer;font:inherit}
.rxb-e{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--accent) 16%,var(--surface-2));animation:rxPop .6s var(--spring)}
.rxb-t{min-width:0}.rxb-t b{display:block;font-size:14px}.rxb-t span{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rxb-t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rxb .btn{flex:none}.rxb-x{flex:none;font-size:14px}
@media(min-width:821px){.rxb{left:calc(50% + 48px)}}
@keyframes rxPop{0%{transform:scale(.3)}100%{transform:scale(1)}}

 box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 14px -8px rgba(40,20,0,.55);transform:rotate(var(--r,0deg));cursor:pointer;transition:transform .45s var(--spring),box-shadow .3s;animation:stNote 7s ease-in-out infinite alternate;min-width:0;text-decoration:none}

/* jointed legs: every joint turns around its own point (view-box units) */

/* walk: lateral four-beat gait (near hind → near front → far hind → far front), stance phases linear so paws don't slide */
.st-cat[data-p=walk] .j{transition:none;animation-duration:var(--P);animation-iteration-count:infinite;animation-timing-function:linear}
.st-cat[data-p=walk] .hip{animation-name:cHip}.st-cat[data-p=walk] .knee{animation-name:cKnee}.st-cat[data-p=walk] .hock{animation-name:cHock}
.st-cat[data-p=walk] .sho{animation-name:cSho}.st-cat[data-p=walk] .elb{animation-name:cElb}.st-cat[data-p=walk] .wri{animation-name:cWri}

.st-cat[data-j=crouch] .hip{transform:rotate(16deg)}.st-cat[data-j=crouch] .knee{transform:rotate(-26deg)}.st-cat[data-j=crouch] .hock{transform:rotate(24deg)}

function calItems(a,b){const M={};const add=(n,it)=>{if(n<a||n>b)return;(M[n]=M[n]||[]).push(it)};
 S.days.forEach(x=>{const g=x.goalId&&G(x.goalId)||null;add(dnum(x.date),{k:'day',id:x.id,x,g,t:x.title,time:x.time||'',done:!!x.done,sub:g?g.title:''})});

   if(st.repeat&&!st.done&&g.status==='active'&&!g.steps.some(y=>y.from===st.id&&!y.done)){const d=dUTC(n0);for(let i=0;i<1500;i++){if(st.repeat==='daily')d.setUTCDate(d.getUTCDate()+1);else if(st.repeat==='weekly')d.setUTCDate(d.getUTCDate()+7);else d.setUTCMonth(d.getUTCMonth()+1);const n=Math.round(d.getTime()/864e5);if(n>b)break;add(n,{k:'rep',g,s:st,t:st.title,time:st.time||'',done:false,sub:g.title})}}});
  if(g.targetDate)add(dnum(g.targetDate),{k:'target',g,t:g.title,time:'',done:g.status==='done',sub:g.status==='done'?'Achieved':pct(g)+'% there'})});

const calOpen=x=>x.k==='day'?`data-act="editDay" data-id="${x.id}"`:x.k==='target'?`data-act="open" data-id="${x.g.id}"`:`data-act="editStep" data-g="${x.g.id}" data-s="${x.s.id}"`;

 <div class="actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn pri">${e?'Save':'Add step'}</button></div></form>`}

function normHabit(h){const k=['build','quit','routine'].includes(h.kind)?h.kind:'build';

function hStrength(h){const tn=dnum(ymd()),st=Math.max(dnum(h.startDate),tn-180);let s=0;
 if(h.freq==='times'){for(let w=wkStart(st);w<=tn;w+=7){const c=weekCount(h,w);if(w+6>=tn&&c<h.times)break;s+=(Math.min(1,c/h.times)-s)*.25}return Math.round(s*100)}

 let due=0,dn=0;for(let k=Math.max(st,tn-days+1);k<=tn;k++){const ds=fromN(k);if(!hDue(h,ds)||h.skip[ds])continue;if(k===tn&&!hDone(h,ds))continue;due++;if(hDone(h,ds))dn++}return due?Math.round(dn/due*100):null}
const freqText=h=>h.freq==='times'?`${h.times}× a week`:h.freq==='days'?(h.days.length===7?'Every day':h.days.join()==='1,2,3,4,5'?'Weekdays':h.days.join()==='0,6'?'Weekends':h.days.map(d=>DAYS[d]).join(', ')):'Every day';

const qSince=h=>Math.max(h.start||0,...h.slips.map(s=>s.t));
const qDays=h=>Math.max(0,Math.floor((Date.now()-qSince(h))/864e5));
function qBest(h){if(h.mode==='limit')return lBest(h);const ts=[h.start,...h.slips.map(s=>s.t).filter(t=>t>=h.start)].sort((a,b)=>a-b);let b=0;for(let i=0;i<ts.length;i++){const e=i+1<ts.length?ts[i+1]:Date.now();b=Math.max(b,e-ts[i])}return Math.floor(b/864e5)}
const lOk=(h,ds)=>(+h.log[ds]||0)<=h.limit;
function lStreak(h){const tn=dnum(ymd()),st=dnum(h.startDate);let n=0;for(let k=tn;k>=st&&tn-k<4000;k--){if(lOk(h,fromN(k)))n++;else break}return n}
function lBest(h){const tn=dnum(ymd()),st=dnum(h.startDate);let b=0,r=0;for(let k=st;k<=tn;k++){if(lOk(h,fromN(k))){r++;b=Math.max(b,r)}else r=0}return b}

const mileName=m=>m>=365?`${m/365} year${m>365?'s':''}`:m>=30?`${Math.round(m/30)} month${m>=60?'s':''}`:m%7===0&&m>=7?`${m/7} week${m>7?'s':''}`:`${m} day${m>1?'s':''}`;
function clockHTML(ms,short){ms=Math.max(0,ms);const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
 return short?`<b>${d}</b>d <b>${h}</b>h`:`<b>${d}</b><small>${d===1?'day':'days'}</small><span class="hms">${pad2(h)}:${pad2(m)}:${pad2(s)}</span>`}

  if(h.kind==='quit'){const v=h.mode==='limit'?lStreak(h)-1:qDays(h),L=h.mode==='limit'?SMILES:MILES,m=floorMile(L,v);if(m>(h.mile||0)){h.mile=m;ch=true;if(announce){won=[h,h.mode==='limit'?`${m} days under your limit`:`${mileName(m)} free`];S.entries.push({id:uid(),t:Date.now(),type:'habit',goalId:h.goalId||null,hid:h.id,text:`${won[1]} · ${h.title}`,sid:null,img:null})}}else if(m<(h.mile||0)){h.mile=m;ch=true}return}
  const s=hStreak(h),L=h.freq==='times'?WMILES:SMILES,m=floorMile(L,s);
  if(m>(h.smile||0)){h.smile=m;ch=true;if(announce){const lab=h.freq==='times'?`${m}-week streak`:`${m}-day streak`;won=[h,lab];S.entries.push({id:uid(),t:Date.now(),type:'habit',goalId:h.goalId||null,hid:h.id,text:`${lab} · ${h.title}`,sid:null,img:null})}}else if(m<(h.smile||0)){h.smile=m;ch=true}});
 if(won){burst();setTimeout(()=>toast(`${esc(hIcon(won[0]))} Milestone: ${esc(won[1])}`),350)}

/* ================= VOICE =================

 On the phone it uses on-device speech recognition when the phone has it (audio stays on the phone).
 Anything that would send audio to an online speech service (the phone's regular recognizer, or the browser's)

 return`<section class="panel wide rv"><h3>Assistant</h3>${insEngineHTML()}</section>

 <label class="sw"><span>Mic buttons<small>Talk instead of typing in the journal, Ask, goals and habits</small></span><input type="checkbox" data-voice="on" ${v.on?'checked':''}><i></i></label>
 ${(NATIVE&&!st.onDevice)||!NATIVE?`<label class="sw"><span>Allow online speech<small>${v.cloud?'Allowed':'Asked the first time you tap a mic'}</small></span><input type="checkbox" data-voice="cloud" ${v.cloud?'checked':''}><i></i></label>`:''}
 <div class="field"><label>Language</label><select data-voice="lang">${[['','Same as my phone'],['en-US','English (US)'],['en-GB','English (UK)'],['en-IN','English (India)'],['ur-PK','Urdu'],['hi-IN','Hindi'],['ar-SA','Arabic'],['es-ES','Spanish'],['fr-FR','French']].map(([k,n])=>`<option value="${k}" ${v.lang===k?'selected':''}>${n}</option>`).join('')}</select></div></section>`}

/* put a mic in each place you write (once per element) */
function micDecorate(root){if(!vset().on||!voiceAvail())return;(root||document).querySelectorAll(VOICE_SEL.join(',')).forEach(el=>{if(el.dataset.mic)return;el.dataset.mic=1;const host=el.parentElement;if(!host)return;host.classList.add('has-mic');if(/flex|grid/.test(getComputedStyle(host).display))host.classList.add('mic-flow');

 b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();VC&&VC.el===el?voiceStop():voiceStart(el,b)});if(el.nextSibling)host.insertBefore(b,el.nextSibling);else host.appendChild(b)})}

async function voiceStart(el,btn){const v=vset(),st=vstate();voiceStop(true);

  else if(k==='err'){const m={perm:'Allow the microphone to use voice',no_on_device:'This phone can’t do on-device speech',7:'Didn’t catch that. Tap the mic and try again',6:'Didn’t hear anything',9:'Allow the microphone to use voice',13:'Speech isn’t available on this phone right now'}[t];voiceStop(false,!!VC.txt);if(m)toast(m)}

/* ================= CHAPTERS + YEAR IN REVIEW =================
 Chapters name seasons of your life ("New job", "Baby #2", "Training for Chicago"). They show as soft bands
 behind the Vista timeline and Habit Vista, and frame the year in review. Synced like goals (S.chapters).
 The year in review is a short story built from your own data: goals reached, habits kept, best month,

const CH_COLS=['#46C99B','#6B9BFF','#AC93FF','#FF8C6B','#F0C862','#F585B8','#A9D14A','#5ED0E6'];

/* ---- year in review ---- */
const yearDefault=()=>{const d=new Date();return d.getMonth()===0&&d.getDate()<=20?d.getFullYear()-1:d.getFullYear()};
function yearData(y){const a=`${y}-01-01`,b=`${y}-12-31`,td=ymd(),end=b<td?b:td,inY=t=>{const s=ymd(new Date(t));return s>=a&&s<=b},M=[...Array(12)].map(()=>({steps:0,checks:0,notes:0}));
 const done=S.goals.filter(g=>g.status==='done'&&g.completedAt&&inY(g.completedAt)).sort((p,q)=>q.completedAt-p.completedAt);
 const started=S.goals.filter(g=>inY(g.createdAt||0)).length;
 const steps=S.entries.filter(e=>e.type==='step'&&inY(e.t));steps.forEach(e=>M[new Date(e.t).getMonth()].steps++);
 let checks=0;const hab=[];S.habits.forEach(h=>{if(h.kind==='quit'){const fr=h.mode==='limit'?lBest(h):qBest(h);hab.push({h,q:1,best:fr});return}
  let n=0,run=0,best=0,due=0;for(let k=dnum(a);k<=dnum(end);k++){const ds=fromN(k);if(ds<h.startDate||!hDue(h,ds)||h.skip[ds])continue;due++;if(hDone(h,ds)){n++;run++;best=Math.max(best,run);M[+ds.slice(5,7)-1].checks++}else if(ds<td)run=0}checks+=n;hab.push({h,n,best,rate:due?Math.round(n/due*100):0})});
 const notes=S.entries.filter(e=>e.type==='note'&&inY(e.t));notes.forEach(e=>M[new Date(e.t).getMonth()].notes++);
 const moods={};notes.forEach(e=>{const m=MOODN[e.mood];if(m)moods[m]=(moods[m]||0)+1});const mt=Object.entries(moods).sort((p,q)=>q[1]-p[1]);const mn=mt.reduce((s,x)=>s+x[1],0);const pos=mn?Math.round(mt.filter(x=>MOOD_POS.has(x[0])).reduce((s,x)=>s+x[1],0)/mn*100):null;
 const words=notes.reduce((s,e)=>s+String(e.text||'').split(/\s+/).filter(Boolean).length,0);
 const score=m=>m.steps*2+m.checks+m.notes;const bestM=M.map((m,i)=>[i,score(m)]).sort((p,q)=>q[1]-p[1])[0];
 const quotes=notes.filter(e=>!e.private&&e.text).map(e=>{const s=String(e.text).replace(/\s+/g,' ').split(/(?<=[.!?])\s/).find(x=>x.length>=30&&x.length<=170);return s?{t:e.t,s,pos:MOOD_POS.has(MOODN[e.mood]||'')}:null}).filter(Boolean);
 const qs=[];[...quotes.filter(x=>x.pos),...quotes].forEach(x=>{if(qs.length<3&&!qs.some(z=>Math.abs(z.t-x.t)<20*864e5))qs.push(x)});qs.sort((p,q)=>p.t-q.t);
 const chs=chapters().filter(c=>c.start<=b&&chEnd(c)>=a);
 const topH=hab.filter(x=>!x.q).sort((p,q)=>q.best-p.best)[0],steady=hab.filter(x=>!x.q&&x.n>=10).sort((p,q)=>q.rate-p.rate)[0],free=hab.filter(x=>x.q).sort((p,q)=>q.best-p.best)[0];
 return{y,done,started,steps:steps.length,checks,M,bestM,topH,steady,free,notes:notes.length,words,mt,pos,qs,chs,active:S.goals.filter(g=>g.status==='active').length}}
const MONTHS=[...Array(12)].map((_,i)=>new Date(2026,i,1).toLocaleDateString(undefined,{month:'long'}));
function yearSlides(D){const nm=S.settings.name,S1=[];const big=(n,l)=>`<div class="yr-big"><b>${n}</b><span>${l}</span></div>`;
 S1.push(`<div class="yr-k">Your ${D.y}</div><h1>${nm?esc(nm)+'’s':'Your'}<br>plotline</h1><p>${D.chs.length?'A year in '+D.chs.length+' chapter'+(D.chs.length>1?'s':'')+'.':'A year of small steps.'} Tap to see it.</p>${D.chs.length?`<div class="yr-chs">${D.chs.map(c=>`<span style="--cc:${c.color}">${esc(c.emoji||'')} ${esc(c.title)}</span>`).join('')}</div>`:''}`);
 S1.push(`<div class="yr-k">Goals</div>${big(D.done.length,D.done.length===1?'goal reached':'goals reached')}${big(D.steps,'steps done')}${D.done.length?`<p>Biggest win: <b>${esc(D.done[0].title)}</b></p>`:`<p>${D.started} goal${D.started===1?'':'s'} started. The finish lines are coming.</p>`}`);
 S1.push(`<div class="yr-k">Habits</div>${big(D.checks.toLocaleString(),'check-ins')}${D.topH&&D.topH.best?`<p>Longest streak: <b>${D.topH.best} days</b> of ${esc(D.topH.h.title)} ${esc(hIcon(D.topH.h))}</p>`:''}${D.steady?`<p>Most steady: <b>${esc(D.steady.h.title)}</b>, kept ${D.steady.rate}% of the days it was due.</p>`:''}${D.free&&D.free.best?`<p>Longest run free of ${esc(D.free.h.title.replace(/^no /i,''))}: <b>${D.free.best} days</b>.</p>`:''}`);

/* ================= SHARING (end-to-end encrypted; only shared items leave your Drive) =================
 Share one goal, habit or step with someone: do it together, compete, or keep each other accountable.
 In plain terms (also shown to the person before anything is shared):
  - Until you share, everything stays only in your own Google Drive.
  - Sharing an item puts an ENCRYPTED copy of just that item in Plotline's sharing space (Google Firebase).
    Each shared item has its own secret key. It is locked on your device before it leaves, and only the
    people you invited can unlock it: not Plotline's developer, not Google, not anyone with the database.
  - Each person has a key pair. The private half is kept in their own Drive (synced with their plan); only the
    public half is published, so others can lock an item's key for them.
  - What the service can see: the email addresses in a share and when something changed. Never what it is.
  - Progress (check-ins, streak, percent) and reactions sync live while the app is open; on Android a background
    check posts invites even when the app is closed.
  - Stopping a share deletes it for everyone; leaving removes your progress.
 S.shares (synced) remembers your circles and their keys; S.ident (synced) is your key pair; settings.share is per device. */
const SHARE_DEF={on:true};
const shset=()=>{const s={...SHARE_DEF,...(S.settings.share||{})};if(s.v!==2){s.on=true;s.v=2}return s};
const shPatch=o=>{S.settings.share={...shset(),...o};save()};
const shares=()=>S.shares||(S.shares=[]);
const MODES={together:{n:'Do it together',e:'🤝',x:'One shared goal. Everyone’s progress adds up.'},compete:{n:'Friendly competition',e:'🏁',x:'Same goal, a leaderboard for the week.'},watch:{n:'Accountability',e:'👀',x:'They see your progress and can send you reactions.'}};
let SHC={t:0,busy:false,kc:{}};
const me=()=>lc(S.settings.sync.email||'');
const myName=()=>S.settings.name||(S.settings.sync.email||'').split('@')[0];
const fbc=()=>{const c=PLOTLINE_CFG.firebase||{};return{key:(c.apiKey||'').trim(),pid:(c.projectId||'').trim()}};
const fsOK=()=>!!(fbc().key&&fbc().pid&&window.crypto&&crypto.subtle);
const shOn=()=>fsOK()&&syncOn()&&shset().on;

/* ---- end-to-end encryption (WebCrypto: ECDH P-256 + AES-GCM; same scheme in ShareCheck.java) ---- */
const b64=u=>{let s='';const a=u instanceof Uint8Array?u:new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const TE=new TextEncoder(),TD=new TextDecoder(),EC={name:'ECDH',namedCurve:'P-256'};
const fpOf=async pub=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',unb64(pub)))].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('');
async function ensureIdent(){if(S.ident&&S.ident.pub&&S.ident.priv)return S.ident;const kp=await crypto.subtle.generateKey(EC,true,['deriveBits']);
 const pub=b64(await crypto.subtle.exportKey('raw',kp.publicKey)),priv=b64(await crypto.subtle.exportKey('pkcs8',kp.privateKey));S.ident={pub,priv,fp:await fpOf(pub),c:Date.now()};DIRTY=true;save();return S.ident}
let PRIVK=null;async function privKey(){const id=S.ident;if(PRIVK&&PRIVK.fp===id.fp)return PRIVK.k;const k=await crypto.subtle.importKey('pkcs8',unb64(id.priv),EC,false,['deriveBits']);PRIVK={fp:id.fp,k};return k}
async function pairKey(theirPub){const pub=await crypto.subtle.importKey('raw',unb64(theirPub),EC,false,[]);const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH',public:pub},await privKey(),256));
 const pre=TE.encode('plotline-wrap-v1'),m=new Uint8Array(pre.length+32);m.set(pre);m.set(bits,pre.length);return crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',m),'AES-GCM',false,['encrypt','decrypt'])}
async function seal(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function unseal(key,s){const a=unb64(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},key,a.slice(12)))}
const ckey=k=>crypto.subtle.importKey('raw',unb64(k),'AES-GCM',false,['encrypt','decrypt']);
const encJ=async(k,o)=>seal(await ckey(k),TE.encode(JSON.stringify(o)));
const decJ=async(k,s)=>JSON.parse(TD.decode(await unseal(await ckey(k),s)));
const wrapFor=async(k,theirPub)=>seal(await pairKey(theirPub),unb64(k));
const unwrapK=async(w,ownerPub)=>b64(await unseal(await pairKey(ownerPub),w));
const newKey=()=>b64(crypto.getRandomValues(new Uint8Array(32)));

/* ---- Firebase sign-in with the Google account you already use for sync ---- */
const FBK='plotline.fb';
const fbGet=()=>{try{return JSON.parse(localStorage.getItem(FBK)||'null')}catch(e){return null}};
function fbPut(o){try{o?localStorage.setItem(FBK,JSON.stringify(o)):localStorage.removeItem(FBK)}catch(e){}fbNative()}
const fme=()=>lc((fbGet()||{}).email||me());
async function fbSignIn(gtok){const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithIdp?key=${fbc().key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postBody:`access_token=${gtok}&providerId=google.com`,requestUri:'http://localhost',returnSecureToken:true,returnIdpCredential:false})});
 const j=await r.json().catch(()=>({}));if(!r.ok||!j.idToken)throw new Error('Sign-in for sharing failed'+(j.error&&j.error.message?': '+j.error.message:' ('+r.status+')'));
 if(!j.email)throw{noEmail:true};
 const s={id:j.idToken,exp:Date.now()+(+j.expiresIn||3600)*1e3,rt:j.refreshToken,email:lc(j.email),uid:j.localId};fbPut(s);return s}
async function fbRefresh(s){let r;try{r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${fbc().key}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.rt)})}catch(e){throw new Error('You’re offline')}
 const j=await r.json().catch(()=>({}));if(!r.ok||!j.id_token){if(r.status===400){fbPut(null);return fbFromGoogle(false)}throw new Error('Sharing sign-in '+r.status)}
 const n={...s,id:j.id_token,rt:j.refresh_token||s.rt,exp:Date.now()+(+j.expires_in||3600)*1e3};fbPut(n);return n}
/* a Google token that includes your email address → a sharing session. If Google hasn’t been told it may share
   your email yet (people who signed in before 1.8.2), you’re asked once, in the app. */
async function fbFromGoogle(interactive){for(let i=0;i<2;i++){let t;try{t=await token(interactive)}catch(e){throw{fbAuth:true}}
  try{const s=await fbSignIn(t);if(shset().allow||shset().lite)shPatch({allow:false,lite:false});return s}
  catch(e){const miss=e&&(e.noEmail||/INVALID_IDP/.test(String(e.message)));if(!miss)throw e;if(i===0&&!interactive&&NATIVE&&S.settings.sync.native&&!shset().lite){tokDrop();continue}shPatch({allow:true});render(false);throw{fbAllow:true}}}}
let FBP=null;
async function fbSession(){let s=fbGet();if(s&&s.email&&me()&&s.email!==me()){fbPut(null);s=null}
 if(s&&s.exp>Date.now()+60e3)return s;
 if(FBP)return FBP;FBP=(s&&s.rt?fbRefresh(s):fbFromGoogle(false)).finally(()=>{FBP=null});return FBP}
/* the Android background check: finds new invites, and (for items you share) locks the item key for people who
   install Plotline after you invited them, so their invite unlocks without you opening the app */
function fbNative(){try{if(!NATIVE||!NATIVE.shareCfg)return;const s=fbGet()||{},c=fbc(),id=S.ident||{};
 NATIVE.shareCfg(JSON.stringify({on:!!(shOn()&&s.rt),key:c.key,pid:c.pid,rt:s.rt||'',email:s.email||'',seen:shares().map(x=>x.id),priv:id.priv||'',owned:shares().filter(x=>x.fs&&x.role==='owner'&&x.status==='joined'&&x.k).map(x=>({cid:x.id,k:x.k})),
  joined:shares().filter(x=>x.fs&&x.status==='joined'&&x.k).map(x=>({cid:x.id,k:x.k,title:String(x.title||'').slice(0,60)})),rx:Object.fromEntries(Object.entries(shset().rx||{}).map(([k,v])=>[k,v.t||0]))}))}catch(e){}}
async function shAllow(){shPatch({lite:false});scopeSync();tokDrop();
 try{const t=NATIVE&&S.settings.sync.native?await nativeAuth(true):await(NATIVE?browserAuthFromApp():webAuth('consent'));await fbSignIn(t);shPatch({allow:false});render(false);toast('Done. Invites will show up here');await shRefresh(true)}
 catch(e){toast(e&&e.noEmail?'Google didn’t confirm your email, so invites can’t reach you yet':shErr(e))}render(false)}

/* ---- Firestore over REST ---- */
const FSB=()=>`https://firestore.googleapis.com/v1/projects/${fbc().pid}/databases/(default)/documents`;
async function fs(path,opt={},retry=true){const s=await fbSession();let r;try{r=await fetch(FSB()+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{}),Authorization:'Bearer '+s.id}})}catch(e){throw new Error('You’re offline')}
 if(r.status===401&&retry){const x=fbGet();if(x)fbPut({...x,exp:0});return fs(path,opt,false)}
 if(r.status===404&&opt.ok404)return null;
 if(!r.ok){let m='';try{const j=await r.json();m=j.error&&(j.error.status||j.error.message)||''}catch(e){}throw new Error(`Sharing ${r.status}${m?': '+m:''}`)}
 const t=await r.text();return t?JSON.parse(t):null}
const fsv=v=>v==null?{nullValue:null}:typeof v==='string'?{stringValue:v}:typeof v==='number'?{integerValue:String(Math.round(v))}:typeof v==='boolean'?{booleanValue:v}:Array.isArray(v)?{arrayValue:{values:v.map(fsv)}}:{stringValue:JSON.stringify(v)};
const fsx=v=>!v?null:'stringValue' in v?v.stringValue:'integerValue' in v?+v.integerValue:'booleanValue' in v?v.booleanValue:'arrayValue' in v?(v.arrayValue.values||[]).map(fsx):'doubleValue' in v?v.doubleValue:null;
const fsEnc=o=>({fields:Object.fromEntries(Object.entries(o).map(([k,v])=>[k,fsv(v)]))});
const fsDec=d=>{const o={_id:decodeURIComponent(d.name.split('/').pop())};for(const k in d.fields||{})o[k]=fsx(d.fields[k]);return o};
const jp=(s,d)=>{try{return s?JSON.parse(s):d}catch(e){return d}};
const circDec=d=>{const c=fsDec(d);c.cid=c._id;c.keys=jp(c.locks,{});c.members=(c.members||[]).map(lc);c.owner=lc(c.owner||'');return c};
const fsCircle=async cid=>{const d=await fs(`/circles/${cid}`,{ok404:true});return d&&circDec(d)};
async function fsMine(){const j=await fs(':runQuery',{method:'POST',body:JSON.stringify({structuredQuery:{from:[{collectionId:'circles'}],where:{fieldFilter:{field:{fieldPath:'members'},op:'ARRAY_CONTAINS',value:{stringValue:fme()}}},limit:200}})});return(j||[]).filter(x=>x.document).map(x=>circDec(x.document))}
async function fsMembers(sh){const j=await fs(`/circles/${sh.id}/ms?pageSize=100`);const out=[];
 for(const d of j&&j.documents||[]){const m=fsDec(d);m.email=lc(m._id);let p={};if(m.enc&&sh.k){try{p=await decJ(sh.k,m.enc)}catch(e){}}m.name=p.name||m.email.split('@')[0];m.progress=p.progress||{};m.cheers=p.cheers||[];out.push(m)}return out}
async function fsSetMe(sh,o){const enc=sh.k&&o.status==='joined'?await encJ(sh.k,{name:myName().slice(0,80),progress:o.progress||{},cheers:o.cheers||[]}):'';
 return fs(`/circles/${sh.id}/ms/${encodeURIComponent(fme())}`,{method:'PATCH',body:JSON.stringify(fsEnc({status:o.status,enc,u:Date.now()}))})}
/* public keys: keys/{email} = {pub, fp}. Only the public half; the private half never leaves your Drive. */
async function publishKey(){const id=await ensureIdent();if(shset().pubfp===id.fp&&shset().pubme===fme())return;
 await fs(`/keys/${encodeURIComponent(fme())}`,{method:'PATCH',body:JSON.stringify(fsEnc({pub:id.pub,fp:id.fp,u:Date.now()}))});shPatch({pubfp:id.fp,pubme:fme()})}
async function keyOf(email,fresh){const c=SHC.kc[email];if(c&&!fresh&&Date.now()-c.t<10*60000)return c.k;const d=await fs(`/keys/${encodeURIComponent(email)}`,{ok404:true});const k=d?fsDec(d):null;SHC.kc[email]={t:Date.now(),k};return k}
/* lock the item key for every member who has a public key and doesn’t have it yet (or got a new key pair) */
async function shWrapMissing(c,sh,fresh){const keys={...c.keys};let ch=0;
 for(const m of c.members){if(m===fme())continue;const pk=await keyOf(m,fresh).catch(()=>null);if(!pk||!pk.pub)continue;if(keys[m]&&keys[m].fp===pk.fp)continue;keys[m]={fp:pk.fp,w:await wrapFor(sh.k,pk.pub)};ch++}
 return ch?keys:null}

/* ---- what my progress looks like for a shared item (only this) ---- */
function shItem(sh){const L=sh.local||{};if(L.kind==='habit')return H(L.id);if(L.kind==='goal')return G(L.id);if(L.kind==='step'){const g=G(L.g);return g&&g.steps.find(s=>s.id===L.id)}return null}
function shProgress(sh){const o=shItem(sh),L=sh.local||{},tn=dnum(ymd()),out={u:Date.now()};if(!o)return out;
 if(L.kind==='habit'){const ch={};for(let k=tn-59;k<=tn;k++){const ds=fromN(k);if(hDone(o,ds))ch[ds]=1}out.checks=ch;out.streak=o.kind==='quit'?qDays(o):hStreak(o);out.rate=hRate(o)}
 else if(L.kind==='goal'){out.pct=pct(o);out.done=o.steps.filter(s=>s.done).map(s=>s.sid||s.id);out.total=o.steps.length}
 else if(L.kind==='step'){out.pct=o.done?100:0;out.done=o.done?[L.id]:[]}
 return out}
const pubKey=p=>JSON.stringify([p.checks,p.streak,p.pct,p.done]);
const weekChecks=p=>{if(!p||!p.checks)return 0;const tn=dnum(ymd());let n=0;for(let k=tn-6;k<=tn;k++)if(p.checks[fromN(k)])n++;return n};

async function shReady(){if(!fsOK()){toast('Sharing isn’t available in this version yet');return false}

<style>@font-face{font-family:'Big Shoulders Display';font-weight:600;font-display:swap;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Big Shoulders Display';font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Big Shoulders Display';font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Martian Mono';font-weight:400;font-display:swap;src:url(fonts/martian-mono-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Martian Mono';font-weight:500;font-display:swap;src:url(fonts/martian-mono-latin-500-normal.woff2) format('woff2')}</style>
<style>
/* ================= tokens ================= */
:root{
 --f-display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
 --f-body:'Figtree',system-ui,-apple-system,sans-serif;
 --f-mono:'Martian Mono',ui-monospace,Menlo,monospace;
 --ease:cubic-bezier(.32,.72,0,1);
 --spring:cubic-bezier(.34,1.3,.5,1);
 --c-health:#46C99B;--c-career:#6B9BFF;--c-family:#FF8C6B;--c-faith:#F0C862;--c-finance:#A9D14A;--c-learning:#AC93FF;--c-personal:#F585B8;
 --on-color:#0B1020;--ink-64:rgba(11,16,32,.64);--ink-16:rgba(11,16,32,.16);
}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.009,.037 1.7%,.153 3.6%,.776 10.3%,1.001 13.7%,1.117 16.9%,1.144 18.4%,1.137 20.6%,1.031 27.4%,.988 32.4%,.981 35.7%,.998 44.6%,1.004 50.1%,1)}}
[data-theme=night]{color-scheme:dark;--bg:#0A0F1F;--bg-2:#0F1528;--surface:#141B32;--surface-2:#1B2340;--line:rgba(200,210,240,.08);--line-2:rgba(200,210,240,.17);--text:#ECEAE3;--muted:#8F96AC;--dim:#4F5876;--accent:#FFB547;--on-accent:#1B1300;--stars:1;--glow:rgba(255,181,71,.07)}
[data-theme=space]{color-scheme:dark;--bg:#000;--bg-2:#06070B;--surface:#0D0F15;--surface-2:#141720;--line:rgba(220,225,240,.08);--line-2:rgba(220,225,240,.16);--text:#F2F2F0;--muted:#8A8F9C;--dim:#474C58;--accent:#9EE6D0;--on-accent:#04110D;--stars:1;--glow:rgba(158,230,208,.05)}
[data-theme=dusk]{color-scheme:dark;--bg:#160E21;--bg-2:#1B122A;--surface:#221734;--surface-2:#2B1F42;--line:rgba(240,215,240,.08);--line-2:rgba(240,215,240,.17);--text:#F4EBF1;--muted:#A897B4;--dim:#5E4E6E;--accent:#FF9E7A;--on-accent:#2A0E04;--stars:.65;--glow:rgba(255,158,122,.08)}
[data-theme=graphite]{color-scheme:dark;--bg:#151719;--bg-2:#1A1C1F;--surface:#1F2226;--surface-2:#272A2F;--line:rgba(230,232,236,.07);--line-2:rgba(230,232,236,.15);--text:#E8E9EB;--muted:#8E939B;--dim:#50555D;--accent:#E8E9EB;--on-accent:#151719;--stars:0;--glow:transparent}
[data-theme=daylight]{color-scheme:light;--bg:#EDF0F6;--bg-2:#E5E9F1;--surface:#FFFFFF;--surface-2:#F4F6FA;--line:rgba(18,26,52,.08);--line-2:rgba(18,26,52,.17);--text:#131A2D;--muted:#5D6580;--dim:#A2A8BA;--accent:#2E5BFF;--on-accent:#fff;--stars:0;--glow:rgba(46,91,255,.06)}

/* ================= base ================= */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--f-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;transition:background-color .6s var(--ease),color .6s var(--ease)}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(1100px 640px at 80% -14%,var(--glow),transparent 62%)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:var(--stars);transition:opacity .8s var(--ease)}
#stars i{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%}
#stars .s2{width:2px;height:2px}
#stars .tw{animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
#stars b{position:absolute;top:12%;left:-10%;width:130px;height:1px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:comet 22s linear infinite 8s}
@keyframes comet{0%{transform:translate(0,0) rotate(20deg);opacity:0}1.5%{opacity:.8}7%{transform:translate(70vw,26vw) rotate(20deg);opacity:0}100%{opacity:0}}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--on-accent)}
.data{font:500 10.5px/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px;line-height:1.55}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ico-s{width:13px;height:13px;vertical-align:-2px;flex:none}
.hide{display:none!important}

/* ================= shell ================= */
#app{display:grid;grid-template-columns:96px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 0 20px;border-right:1px solid var(--line)}
.rail>a{margin-bottom:28px}
.logo{width:38px;height:38px;display:block}
.navs{position:relative;display:flex;flex-direction:column;gap:4px}
.nav{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;padding:10px 0 9px;border-radius:18px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;transition:color .35s var(--ease)}
.nav svg{width:22px;height:22px;transition:transform .5s var(--spring)}
.nav:hover{color:var(--text)}
.nav:active svg{transform:scale(.84)}
.nav.on{color:var(--text)}
.nav.on svg{color:var(--accent)}
.nav-ind{position:absolute;left:0;top:0;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);pointer-events:none;z-index:0;transition:transform .6s var(--spring),width .6s var(--spring),height .6s var(--spring),opacity .3s}
.rail .spacer{flex:1}
main{--gutter:clamp(18px,4vw,56px);min-width:0;width:100%;max-width:1120px;margin:0 auto;padding:44px var(--gutter) 150px}
.tabbar{display:none}
.mob{display:none!important}
@media(max-width:820px){
 #app{grid-template-columns:1fr}.rail{display:none}
 .tabbar{display:block;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--bg-2) 80%,transparent);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--line-2);box-shadow:0 20px 50px -14px rgba(0,0,0,.55)}
 .tabbar .navs{flex-direction:row;gap:0}
 .tabbar .nav{flex:1;width:auto;font-size:10px;padding:8px 0 7px;border-radius:20px}
 .tabbar .nav-ind{border-radius:20px}
 main{--gutter:16px;padding:24px 16px 130px}
 .mob{display:grid!important}
}

/* ================= type & header ================= */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:30px}
.ph h1{font:800 clamp(40px,7.4vw,74px)/.88 var(--f-display);text-transform:uppercase;letter-spacing:.004em}
.ph p{color:var(--muted);margin-top:12px;max-width:520px}
.ph .data{margin-top:14px}
.ph-r{display:flex;gap:8px;flex:none}
.st-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:44px 0 14px}
.st-h h3{font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.crumb{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}

/* ================= controls ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:600 14.5px var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .5s var(--spring),background-color .25s,border-color .25s,color .25s}
.btn:hover{border-color:color-mix(in srgb,var(--text) 32%,transparent)}
.btn:active{transform:scale(.95);transition-duration:.15s}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:#FF7A7A}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.ink{background:var(--t-fg,var(--on-color));color:var(--t-inv,#F4F2EC);border-color:transparent}
.btn.inkline{background:transparent;color:var(--t-fg,var(--on-color));border-color:color-mix(in srgb,var(--t-fg,#0B1020) 28%,transparent)}
.btn.inkline:hover{border-color:color-mix(in srgb,var(--t-fg,#0B1020) 60%,transparent)}
.btn svg{width:18px;height:18px}
.ibtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;flex:none;transition:transform .5s var(--spring),border-color .2s,color .2s}
.ibtn:hover{border-color:var(--line-2)}
.ibtn:active{transform:scale(.88);transition-duration:.15s}
.ibtn svg{width:20px;height:20px}
.ibtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.ibtn.sm{width:38px;height:38px;border-radius:12px}
.ibtn.sm svg{width:17px;height:17px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}
.seg-c{position:relative;display:inline-flex;padding:4px;border-radius:15px;background:var(--surface);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg-c::-webkit-scrollbar{display:none}
.seg-c button{position:relative;z-index:1;border:0;background:none;padding:9px 15px;border-radius:11px;font:600 13.5px var(--f-body);color:var(--muted);cursor:pointer;transition:color .35s var(--ease);white-space:nowrap}
.seg-c button.on{color:var(--text)}
.seg-c .pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:11px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2),0 6px 16px -8px rgba(0,0,0,.45);transition:transform .6s var(--spring),width .6s var(--spring)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:600 13.5px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .45s var(--spring),background-color .2s,color .2s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.chip svg{width:15px;height:15px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .25s;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea{min-height:104px;resize:vertical;line-height:1.5}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select option{background:var(--bg-2);color:var(--text)}
input[type=date],input[type=time]{min-height:48px}
input[type=range]{padding:0;border:0;background:none;height:26px;box-shadow:none;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
input[type=checkbox]{width:auto}
.sel{width:auto;height:46px;padding:0 38px 0 14px;font-size:14px;font-weight:600;border-radius:15px;border-color:var(--line)}
.field{margin-bottom:16px}
.field>label,.lbl{display:block;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr;gap:0}}
.radios{display:flex;gap:6px}
.radios label{flex:1;position:relative}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios span{display:block;text-align:center;padding:12px 2px;border-radius:13px;border:1px solid var(--line-2);cursor:pointer;font-weight:600;font-size:14px;transition:background-color .25s,color .25s}
.radios input:checked+span{background:var(--text);color:var(--bg);border-color:transparent}
.radios input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.radios.sm span{padding:9px 0;font-size:12.5px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.actions.left{justify-content:flex-start}
.sw{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;cursor:pointer;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{position:relative;width:50px;height:30px;border-radius:30px;background:var(--line-2);transition:background-color .35s var(--ease);flex:none}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .55s var(--spring)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.sw small{display:block;color:var(--muted);font-size:13px}

/* ================= colored surfaces ================= */
.tint{--t-bg:var(--c);--t-fg:#0B1020;--t-mut:rgba(11,16,32,.64);--t-bd:transparent;--t-sh:none;--t-num:var(--t-fg);--t-numsh:none;--t-stroke:0 transparent;--t-bar:#0B1020;--t-barbg:rgba(11,16,32,.16);--t-barsh:none;--t-inv:#F4F2EC;--t-ring:rgba(11,16,32,.13);--t-moon:rgba(11,16,32,.24);--t-blur:none;
 background:var(--t-bg);color:var(--t-fg);border:1px solid var(--t-bd);box-shadow:var(--t-sh);-webkit-backdrop-filter:var(--t-blur);backdrop-filter:var(--t-blur);position:relative;overflow:hidden;isolation:isolate}
.tint .data{color:var(--t-mut)}
.tint::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:var(--t-fg);opacity:0;-webkit-mask:var(--pat,none) repeat;mask:var(--pat,none) repeat;-webkit-mask-size:var(--pat-s,24px);mask-size:var(--pat-s,24px)}
.tint::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:var(--img,none) center/cover no-repeat}
:is(.sc-back,.jf-back).tint::before{box-shadow:inset 0 0 0 2000px rgba(0,0,0,.55)}
.pbar{height:4px;border-radius:4px;background:var(--line-2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--accent));transition:width 1.1s var(--ease)}
.tint .pbar{background:var(--t-barbg)}
.tint .pbar i{background:var(--t-bar);box-shadow:var(--t-barsh)}
.tint :is(.fc-n,.sc-n,.hero-pct,.cprev-n,.nbadge){color:var(--t-num);text-shadow:var(--t-numsh);-webkit-text-stroke:var(--t-stroke)}
.tint .kv{border-top-color:color-mix(in srgb,var(--t-fg) 14%,transparent)}
.tint .kv span:first-child,.tint .note{color:var(--t-mut)}
/* card styles — html[data-cards] sets the default, [data-cs] previews a style */
:root[data-cards=glow] .tint:not([data-cs]),.tint[data-cs=glow]{--t-bg:radial-gradient(130% 100% at 0% 0%,color-mix(in srgb,var(--c) 40%,transparent),transparent 58%),radial-gradient(90% 70% at 100% 100%,color-mix(in srgb,var(--c) 18%,transparent),transparent 60%),color-mix(in srgb,var(--c) 7%,var(--surface));--t-fg:var(--text);--t-mut:var(--muted);--t-bd:color-mix(in srgb,var(--c) 45%,transparent);--t-sh:0 26px 60px -26px color-mix(in srgb,var(--c) 80%,transparent),0 0 38px -12px color-mix(in srgb,var(--c) 60%,transparent);--t-num:var(--c);--t-numsh:0 0 24px color-mix(in srgb,var(--c) 75%,transparent);--t-bar:var(--c);--t-barbg:var(--line-2);--t-barsh:0 0 10px var(--c);--t-inv:var(--bg);--t-ring:color-mix(in srgb,var(--c) 40%,transparent);--t-moon:color-mix(in srgb,var(--c) 40%,transparent)}
:root[data-cards=neon] .tint:not([data-cs]),.tint[data-cs=neon]{--t-bg:linear-gradient(180deg,color-mix(in srgb,var(--c) 7%,var(--bg)),var(--bg) 70%);--t-fg:var(--text);--t-mut:color-mix(in srgb,var(--c) 65%,var(--muted));--t-bd:var(--c);--t-sh:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 0 24px -2px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 30px -12px color-mix(in srgb,var(--c) 80%,transparent);--t-num:transparent;--t-stroke:1.6px var(--c);--t-numsh:0 0 18px color-mix(in srgb,var(--c) 85%,transparent);--t-bar:var(--c);--t-barbg:color-mix(in srgb,var(--c) 16%,transparent);--t-barsh:0 0 8px var(--c),0 0 18px var(--c);--t-inv:var(--bg);--t-ring:color-mix(in srgb,var(--c) 32%,transparent);--t-moon:color-mix(in srgb,var(--c) 40%,transparent)}
:root[data-cards=aurora] .tint:not([data-cs]),.tint[data-cs=aurora]{--t-bg:radial-gradient(60% 55% at 12% 10%,color-mix(in srgb,var(--c) 70%,#fff) 0,transparent 70%),radial-gradient(70% 65% at 100% 0%,var(--c2,var(--c)) 0,transparent 72%),radial-gradient(80% 70% at 30% 105%,var(--c3,var(--c)) 0,transparent 70%),radial-gradient(60% 60% at 90% 90%,var(--c2,var(--c)) 0,transparent 70%),var(--c);--t-ring:rgba(255,255,255,.28);--t-moon:rgba(255,255,255,.6);--t-sh:0 22px 50px -26px color-mix(in srgb,var(--c) 90%,transparent);background-size:135% 135%;animation:aurora 14s ease-in-out infinite alternate}
@keyframes aurora{0%{background-position:0% 0%}100%{background-position:100% 100%}}
:root[data-cards=glass] .tint:not([data-cs]),.tint[data-cs=glass]{--t-bg:linear-gradient(155deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 7%,transparent) 70%);--t-blur:blur(22px) saturate(170%);--t-fg:var(--text);--t-mut:var(--muted);--t-bd:color-mix(in srgb,var(--c) 40%,rgba(255,255,255,.14));--t-sh:inset 0 1px 0 rgba(255,255,255,.16),0 22px 50px -28px rgba(0,0,0,.75);--t-num:var(--text);--t-bar:var(--c);--t-barbg:rgba(255,255,255,.12);--t-inv:var(--bg);--t-ring:rgba(255,255,255,.1);--t-moon:color-mix(in srgb,var(--c) 40%,transparent)}
:root[data-cards=index] .tint:not([data-cs]),.tint[data-cs=index]{--t-bg:linear-gradient(90deg,var(--c) 0 8px,#FAFBFD 8px);--t-fg:#141A2C;--t-mut:#5E667C;--t-bd:rgba(20,26,44,.07);--t-sh:0 20px 44px -26px rgba(0,0,0,.65);--t-num:color-mix(in srgb,var(--c) 58%,#0B1020);--t-bar:color-mix(in srgb,var(--c) 70%,#0B1020);--t-barbg:rgba(20,26,44,.08);--t-inv:#fff;--t-ring:color-mix(in srgb,var(--c) 30%,transparent);--t-moon:var(--c)}
.pbar.lite{background:var(--line-2)}
.pbar.lite i{background:var(--c,var(--accent))}

/* ================= today ================= */
.now{border-radius:30px;padding:clamp(22px,4vw,34px)}
.now h2{font:800 clamp(34px,5.4vw,56px)/.92 var(--f-display);text-transform:uppercase;margin:16px 0 12px;max-width:18ch;text-wrap:balance}
.now-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.list{border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background-color .25s}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.li .s i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.due.over{color:#FF7A7A}.due.soon{color:var(--accent)}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);background:none;display:grid;place-items:center;color:transparent;cursor:pointer;transition:transform .5s var(--spring),background-color .25s,border-color .25s}
.chk:hover{border-color:var(--c)}
.chk:active{transform:scale(.8)}
.chk svg{width:15px;height:15px;stroke-width:3}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{scroll-snap-align:start;flex:none;width:210px;height:156px;border-radius:24px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;transition:transform .55s var(--spring)}
.mini:active{transform:scale(.96)}
.mini .t{font-weight:700;font-size:16px;line-height:1.25;margin-bottom:12px}

/* ================= goal flip cards ================= */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr 1fr;gap:10px}}
.fc{perspective:1400px;height:264px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .6s var(--spring)}
.fc:hover{transform:translateY(-4px)}
.fc:active{transform:scale(.98)}
@media(max-width:560px){.fc{height:226px}}
.fc-in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .9s var(--spring)}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:26px;padding:18px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.fgrid{padding:6px;margin:-6px}
.fc-top .data{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc-top svg{width:16px;height:16px}
.fc-n{font:800 88px/.78 var(--f-display);margin-top:auto;letter-spacing:-.01em}
.fc-t{font-weight:700;font-size:17px;line-height:1.25;margin:12px 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-p{margin-top:8px}
@media(max-width:560px){.fc-n{font-size:66px}.fc-t{font-size:15px;margin:10px 0 12px}.fc-face{padding:15px;border-radius:22px}}
.fc.done .fc-front{filter:saturate(.35) brightness(.86)}
.fc-back{transform:rotateY(180deg);background:var(--surface-2);border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));gap:10px}
.fc-back .bt{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px;line-height:1.25}
.fc-back .bt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.fc-back .nx{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kv{display:flex;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.kv span:first-child{color:var(--muted)}
.fc-act{display:flex;gap:8px;margin-top:auto}
.fc-act .btn{flex:1}
@media(max-width:560px){.fc-back .why,.fc-back .kv:nth-of-type(2){display:none}}

/* ================= goal hero ================= */
.hero{border-radius:34px;padding:clamp(22px,4.4vw,40px);margin-bottom:26px}
.hero h1{font:800 clamp(46px,8vw,86px)/.86 var(--f-display);text-transform:uppercase;margin:16px 0 14px;max-width:20ch;text-wrap:balance}
.hero .why{font-size:16.5px;line-height:1.5;max-width:52ch;opacity:.82}
.hero-f{display:flex;align-items:flex-end;gap:22px;margin-top:30px}
.hero-f>div:first-child{flex:1;min-width:0}
.hero-f .pbar{height:6px;margin-top:12px}
.hero-pct{font:800 76px/.78 var(--f-display)}
.hero-pct small{font-size:30px}
@media(max-width:560px){.hero-pct{font-size:58px}.hero{border-radius:28px}}
.gchip{display:inline-flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px;margin:0 8px 8px 0;transition:transform .5s var(--spring),border-color .2s}
.gchip:hover{border-color:var(--c)}
.gchip:active{transform:scale(.95)}
.gchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.gchip span{color:var(--muted);font:500 10.5px var(--f-mono)}

/* ================= flight-path spine ================= */
.spine{position:relative;padding:14px 0 10px}
.spine::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:repeating-linear-gradient(var(--line-2) 0 4px,transparent 4px 11px)}
.spine-fill{position:absolute;left:50%;top:0;width:2px;margin-left:-1px;height:0;background:var(--c);border-radius:2px;transition:height 1.2s var(--ease);box-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.sp-item{position:relative;display:grid;grid-template-columns:1fr 76px 1fr;align-items:center}
.sp-item+.sp-item{margin-top:-26px}
.sp-card{grid-row:1;min-width:0;position:relative}
.sp-item.l .sp-card{grid-column:1}
.sp-item.r .sp-card{grid-column:3}
.sp-item>.node,.sp-item>.jdot{grid-row:1;grid-column:2;justify-self:center}
.sp-card::after{content:'';position:absolute;top:50%;width:21px;height:2px;margin-top:-1px;background:var(--c,var(--line-2));opacity:.55}
.sp-item.l .sp-card::after{right:-21px}
.sp-item.r .sp-card::after{left:-21px}
.node{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 75%,transparent);background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,var(--bg)) 0,var(--bg) 72%);box-shadow:0 0 12px -3px color-mix(in srgb,var(--c) 75%,transparent);display:grid;place-items:center;color:#0B1020;cursor:pointer;flex:none;transition:transform .55s var(--spring),box-shadow .3s}
.node.static{cursor:default}
.node:hover{transform:scale(1.1)}
.node:active{transform:scale(.85)}
.node svg{width:16px;height:16px;stroke-width:3}
:is(.sp-item,.hs-item).done .node{background:radial-gradient(circle at 38% 32%,#fff 0,var(--c) 44%,color-mix(in srgb,var(--c) 55%,#000) 100%);border-color:transparent;box-shadow:0 0 12px var(--c),0 0 32px color-mix(in srgb,var(--c) 55%,transparent)}
:is(.sp-item,.hs-item).cur .node{animation:led 2.4s var(--ease) infinite}
@keyframes led{0%,100%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent),0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--c) 5%,transparent),0 0 30px var(--c)}}
.sp-date{position:relative;z-index:1;display:flex;justify-content:center;margin:26px 0 14px}
.sp-date span{background:var(--bg);border:1px solid var(--line-2);padding:5px 14px;border-radius:999px}
.sp-date+.sp-item{margin-top:0}
.jdot{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0,var(--c,var(--muted)) 50%);box-shadow:0 0 10px var(--c,transparent),0 0 22px color-mix(in srgb,var(--c,transparent) 50%,transparent)}
@media(max-width:620px){
 .sp-item{grid-template-columns:1fr 46px 1fr}
 .sp-item+.sp-item{margin-top:-22px}
 .sp-card::after{width:10px}.sp-item.l .sp-card::after{right:-10px}.sp-item.r .sp-card::after{left:-10px}
 .node{width:28px;height:28px}.node svg{width:13px;height:13px}
}
/* step flip card */
.sc{perspective:1200px;cursor:pointer;-webkit-user-select:none;user-select:none}
.sc-in{display:grid;transform-style:preserve-3d;transition:transform .85s var(--spring)}
.sc.flip .sc-in{transform:rotateY(180deg)}
.sc-face{grid-area:1/1;border-radius:22px;padding:16px 18px;-webkit-backface-visibility:hidden;backface-visibility:hidden;min-height:118px;display:flex;flex-direction:column}
.sc-n{font:800 40px/.8 var(--f-display)}
.sc-t{font-weight:700;font-size:15.5px;line-height:1.28;margin:10px 0 8px}
.sc:not(.big) .sc-front>.data{margin-top:auto;display:flex;gap:6px;align-items:center}
:is(.sp-item,.hs-item).done .sc-front{filter:saturate(.3) brightness(.8)}
:is(.sp-item,.hs-item).done .sc-t{text-decoration:line-through;text-decoration-thickness:2px}
:is(.sp-item,.hs-item).cur .sc-front{box-shadow:var(--t-sh),0 26px 60px -24px color-mix(in srgb,var(--c) 90%,transparent)}
.sc-back{transform:rotateY(180deg);background:var(--surface-2);border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));gap:8px}
.sc-back .note{font-size:13.5px;line-height:1.45;color:var(--muted)}
.sc-back .kv:first-child{border-top:0;padding-top:0}
.sc-act{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.sc-act .btn{flex:1;padding:0 10px}
@media(max-width:620px){.sc-face{padding:13px 13px;border-radius:18px;min-height:108px}.sc-n{font-size:32px}.sc-t{font-size:14px}.sc-act .btn span{display:none}}
.add-step{display:flex;justify-content:center;margin-top:18px;position:relative;z-index:1}
/* journal card */
.jc{border-radius:20px;padding:15px 17px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--line-2))}
.jc.tint{border:0}
.jc .jh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.jc .jt{line-height:1.45;font-size:14.5px}
.jc .jg{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--muted)}
.jc.tint .jg{color:var(--ink-64)}
.jc img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:13px;margin-top:10px}
.jc .x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;padding:2px;display:grid}
.jc .x svg{width:15px;height:15px}
.jc.big .jt{font:800 26px/.95 var(--f-display);text-transform:uppercase}
@media(max-width:620px){.jc{padding:12px 13px}.jc .jt{font-size:13.5px}.jc.big .jt{font-size:21px}}

/* ================= reveal ================= */
.rv{opacity:0;transform:translateY(26px) scale(.985);transition:opacity .8s var(--ease),transform 1s var(--ease)}
.sp-item.l.rv{transform:translateX(-26px)}
.sp-item.r.rv{transform:translateX(26px)}
.rv.in,.sp-item.l.rv.in,.sp-item.r.rv.in{opacity:1;transform:none}

/* ================= empty ================= */
.empty{text-align:center;padding:52px 24px;border:1.5px dashed var(--line-2);border-radius:28px}
.empty h3{font:800 34px/.95 var(--f-display);text-transform:uppercase;margin:0 auto 12px;max-width:16ch}
.empty p{color:var(--muted);max-width:420px;margin:0 auto}
.empty .actions{justify-content:center}

/* ================= timeline (flowing tracks) ================= */
.road{position:relative;overflow-x:auto;overflow-y:hidden;--lab:0px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:0 calc(-1 * var(--gutter));-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--gutter),#000 calc(100% - var(--gutter)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--gutter),#000 calc(100% - var(--gutter)),transparent)}
.road::-webkit-scrollbar{display:none}
.road-in{position:relative;box-sizing:content-box;padding:0 var(--gutter) 22px}
.fl-ax{position:relative;height:44px}
.fl-tk{position:absolute;top:12px;padding-left:10px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.fl-tk::before{content:'';position:absolute;left:0;top:5px;width:4px;height:4px;border-radius:50%;background:var(--dim)}
.fl-tk.yr{color:var(--text)}
.fl-tk.wk{top:14px;padding-left:0;font-size:9.5px;color:var(--dim);transform:translateX(-50%)}
.fl-tk.wk::before{display:none}
.fl-row{position:relative}
.fl-row>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.fl-base{fill:none;stroke:var(--c);stroke-opacity:.2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:stroke-opacity .3s}
.fl-prog{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 75%,transparent))}
.fl-hit{fill:none;stroke:transparent;stroke-width:28;pointer-events:stroke;cursor:pointer}
.fl-row:hover .fl-base{stroke-opacity:.34}
.fl-row.halo .fl-prog{filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 calc(var(--hr) * .4) color-mix(in srgb,var(--c) var(--ha),transparent))}
.fl-row.halo .fl-base{stroke-opacity:.3}
.fl-dot,.fl-end,.fl-ship,.fl-st{position:absolute;border-radius:50%;pointer-events:none}
.fl-dot{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--c);box-shadow:0 0 10px var(--c)}
.fl-end{width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid var(--c);background:var(--bg);box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent)}
.fl-st{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:var(--bg);box-shadow:0 0 0 1.5px var(--c)}
.fl-st.d{background:var(--c)}
.fl-ship{width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent),0 0 18px var(--c)}
.fl-ship::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--c);animation:flping 2.6s var(--ease) infinite}
@keyframes flping{from{transform:scale(.35);opacity:.9}to{transform:scale(1.7);opacity:0}}
.fl-chip{position:sticky;left:var(--gutter);z-index:3;display:inline-flex;align-items:center;gap:10px;max-width:min(340px,74vw);margin-top:6px;padding:6px 14px 6px 7px;border-radius:999px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);cursor:pointer;transition:border-color .3s,background-color .3s}
.fl-chip:hover{border-color:var(--line-2)}
.fl-row.open .fl-chip{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.fl-chip .pr{flex:none;width:28px;height:28px;transform:rotate(-90deg)}
.fl-chip .pr circle{fill:none;stroke-width:3.5}
.fl-chip .pr .a{stroke:color-mix(in srgb,var(--c) 22%,transparent)}
.fl-chip .pr .b{stroke:var(--c);stroke-linecap:round}
.fl-chip .tx{min-width:0}
.fl-chip b{display:block;font:700 15px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-chip .data{display:block;font-size:9.5px;margin-top:3px;white-space:nowrap}
.fl-chip .link{flex:none;font-size:12.5px;margin-left:2px}
.today-line{position:absolute;top:36px;bottom:14px;width:2px;margin-left:-1px;z-index:2;pointer-events:none}
.today-line::before{content:'';position:absolute;inset:0;border-radius:2px;transform-origin:top;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent) 65%,transparent)}
.today-line span{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font:500 10px var(--f-mono);letter-spacing:.08em;color:var(--on-accent);background:var(--accent);padding:3px 8px;border-radius:999px;box-shadow:0 0 16px color-mix(in srgb,var(--accent) 55%,transparent)}
.road.draw .fl-base,.fl-row.draw .fl-base,.road.draw .fl-prog,.fl-row.draw .fl-prog{stroke-dasharray:1 1;animation:fldraw 2.2s cubic-bezier(.45,.05,.25,1) both;animation-delay:calc(var(--i,0) * 120ms)}
.road.draw .fl-prog,.fl-row.draw .fl-prog{animation-duration:1.7s;animation-delay:calc(var(--i,0) * 120ms + 300ms)}
@keyframes fldraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.road.draw .fl-pop,.fl-row.draw .fl-pop{animation:pop .6s var(--spring) both;animation-delay:calc(var(--i,0) * 120ms + var(--at,0ms))}
.road.draw .today-line::before,.today-line.grow::before{animation:flgrow 1.1s var(--ease) both}
.road.draw .today-line span,.today-line.grow span{animation:flpill .7s var(--spring) .15s both}
@keyframes flgrow{from{transform:scaleY(0)}}
@keyframes flpill{from{opacity:0;transform:translate(-50%,8px) scale(.6)}}
.road.single{margin:0}
.road.single:not(.multi) .fl-chip{display:none}
.spl{position:absolute;top:50%;z-index:3;width:0;height:0;padding:0;border:0;background:none;cursor:pointer;color:var(--text);z-index:1;animation:pop .6s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.spl b{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--c);background:var(--bg-2);box-shadow:0 0 10px -2px var(--c);transition:transform .45s var(--spring)}
.spl:hover b{transform:scale(1.3)}
.spl.done b{background:radial-gradient(circle at 38% 32%,#fff 0,var(--c) 50%);border-color:transparent;box-shadow:0 0 12px var(--c),0 0 24px color-mix(in srgb,var(--c) 50%,transparent)}
.spl.nodate b{border-style:dashed}
.spl.over b{border-color:#FF7A7A}
.spl span{position:absolute;left:-68px;width:136px;text-align:center;font-size:12px;font-weight:600;line-height:1.28;pointer-events:none}
.spl span em{display:block;font:500 9.5px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.spl.up span{bottom:17px}.spl.dn span{top:17px}.spl.up.far span{bottom:58px}.spl.dn.far span{top:58px}
.spl.far::before{content:'';position:absolute;left:-.5px;width:1px;height:44px;background:var(--line-2)}
.spl.up.far::before{bottom:10px}.spl.dn.far::before{top:10px}
.spl.done span{color:var(--muted)}

/* ================= map ================= */
.mapwrap{position:relative;height:calc(100vh - 220px);min-height:460px;border-radius:32px;border:1px solid var(--line);background:radial-gradient(circle at 50% 46%,var(--glow),transparent 62%),var(--bg-2);overflow:hidden}
@media(max-width:820px){.mapwrap{height:calc(100vh - 262px);min-height:400px;border-radius:26px}}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
#map.drag{cursor:grabbing}
#mapg{transform-origin:0 0}
#mapg.anim{transition:transform .7s var(--ease)}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl .ibtn{background:color-mix(in srgb,var(--bg-2) 80%,transparent);backdrop-filter:blur(10px)}
.mapdock{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:18px;background:color-mix(in srgb,var(--bg-2) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);max-width:calc(100% - 24px)}
.mapdock input{width:120px}
.m-orbit{fill:none;stroke:var(--line-2);stroke-dasharray:2 10}
.m-star{fill:var(--text)}
.m-edge{stroke:var(--line-2);stroke-width:1;fill:none;transition:opacity .4s}
.m-edge.a{stroke-opacity:.55;stroke-width:1.5}
.m-link{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 6;fill:none;opacity:.8;animation:dash 1.4s linear infinite;transition:opacity .4s}
@keyframes dash{to{stroke-dashoffset:-11}}
.m-goal,.m-area{transition:opacity .4s var(--ease)}
.m-goal{cursor:pointer}
.m-area{cursor:grab}
.m-goal.dim,.m-area.dim{opacity:.18}.m-link.dim,.m-edge.dim{opacity:.07}
.m-pct{font:800 15px var(--f-display);text-anchor:middle;pointer-events:none}
.m-label{font:600 14px var(--f-body);fill:var(--text);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg-2);stroke-width:5px;stroke-linejoin:round}
.m-area text{font:500 9.5px var(--f-mono);letter-spacing:.1em}
.m-me text{font:800 15px var(--f-display);text-anchor:middle;fill:var(--on-accent);text-transform:uppercase}
.m-halo{fill:var(--accent);opacity:.08;animation:breathe 5s var(--ease) infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:scale(1.22);opacity:.03}}
.mapcard{position:absolute;left:12px;right:12px;bottom:66px;margin:0 auto;max-width:440px;display:flex;gap:14px;align-items:center;padding:12px 12px 12px 18px;border-radius:22px;animation:cardup .6s var(--spring)}
@keyframes cardup{from{opacity:0;transform:translateY(20px) scale(.96)}}
.mapcard .t{font:800 22px/.95 var(--f-display);text-transform:uppercase}

/* ================= AI flow ================= */
.fstep{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:26px 0;border-top:1px solid var(--line)}
.fstep:first-of-type{border-top:0}
.fnum{font:800 52px/.8 var(--f-display);color:var(--dim);transition:color .4s}
.fstep.on .fnum{color:var(--accent)}
.fstep h3{font:700 22px/1.05 var(--f-display);text-transform:uppercase;margin-bottom:6px}
.fstep textarea{margin-top:14px}
.pv{display:flex;gap:14px;padding:16px;border-radius:20px;border:1px solid var(--line);margin-top:10px;cursor:pointer;background:var(--surface);transition:border-color .25s}
.pv.on{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.pv input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.pv .t{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pv .m{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.pv ol{margin:8px 0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.65}
.pv.keep{opacity:.5;cursor:default}
.badge{font:500 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.badge.add{background:color-mix(in srgb,#46C99B 18%,transparent);color:#46C99B}
.badge.update{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.remove{background:rgba(255,122,122,.15);color:#FF7A7A}
.nb{font:500 9.5px var(--f-mono);color:#46C99B;text-transform:uppercase}
.errbox{margin-top:14px;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,122,122,.45);background:rgba(255,122,122,.07)}
.errbox ul{margin:8px 0 0 18px;font-size:13.5px;line-height:1.6}
details.panel summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel summary::after{content:'+';font:800 26px/1 var(--f-display);color:var(--muted);transition:transform .5s var(--spring)}
details.panel[open] summary::after{transform:rotate(45deg)}
pre.spec{white-space:pre-wrap;font:11.5px/1.6 var(--f-mono);background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;max-height:400px;overflow:auto}

/* ================= settings ================= */
.set{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
@media(max-width:560px){.set{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px}
.panel.wide{grid-column:1/-1}
.panel h3{font:700 24px/1 var(--f-display);text-transform:uppercase;margin-bottom:14px}
.panel p.small{margin-bottom:6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{border-radius:20px;border:1.5px solid var(--line-2);padding:8px 8px 12px;cursor:pointer;background:none;text-align:left;transition:transform .55s var(--spring),border-color .25s}
.tcard:hover{transform:translateY(-3px)}
.tcard:active{transform:scale(.96)}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.tprev{height:92px;border-radius:14px;position:relative;overflow:hidden;margin-bottom:10px}
.tprev b{position:absolute;left:10px;right:40px;bottom:10px;height:26px;border-radius:8px}
.tprev u{position:absolute;right:10px;bottom:10px;width:24px;height:24px;border-radius:50%}
.tprev s{position:absolute;left:10px;top:10px;display:flex;gap:4px}
.tprev s i{width:14px;height:14px;border-radius:4px}
.tcard .n{font-weight:700;font-size:14px;padding:0 4px}

/* ================= overlays ================= */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,5,12,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:50%;top:50%;width:min(540px,calc(100vw - 32px));max-height:86vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:30px;padding:28px;box-shadow:0 40px 90px -24px rgba(0,0,0,.65);opacity:0;visibility:hidden;transform:translate(-50%,-47%) scale(.95);transition:transform .45s var(--ease),opacity .3s var(--ease),visibility 0s .45s;overscroll-behavior:contain}
.sheet.on{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition:transform .6s var(--spring),opacity .3s var(--ease),visibility 0s}
.sheet h2{font:800 34px/.92 var(--f-display);text-transform:uppercase;margin-bottom:16px}
.sheet>p{margin-bottom:16px;line-height:1.55}
.grab{display:none}
@media(max-width:820px){
 .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:32px 32px 0 0;opacity:1;transform:translateY(105%);padding:12px 20px calc(24px + env(safe-area-inset-bottom));transition:transform .5s var(--ease),visibility 0s .5s}
 .sheet.on{transform:none;transition:transform .6s var(--ease),visibility 0s}
 .grab{display:block;width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 18px;cursor:grab}
 .sheet h2{font-size:30px}
}
.menu button{display:flex;gap:14px;align-items:center;width:100%;padding:15px 12px;border-radius:14px;background:none;border:0;font-size:15.5px;font-weight:500;cursor:pointer;text-align:left;transition:background-color .2s}
.menu button:hover{background:var(--surface)}
.menu svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu .danger,.menu .danger svg{color:#FF7A7A}
.clist{max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.citem{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);cursor:pointer}
.citem input{width:19px;height:19px;accent-color:var(--accent)}
.citem i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.citem span{flex:1;font-weight:600}
.ph-prev{display:block;width:100%;border-radius:14px;margin-top:10px;max-height:260px;object-fit:cover}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:90;transform:translate(-50%,-160%);background:var(--text);color:var(--bg);padding:12px 16px 12px 18px;border-radius:999px;display:flex;gap:14px;align-items:center;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);font-size:14px;font-weight:600;transition:transform .7s var(--spring);max-width:calc(100vw - 28px)}
.toast.on{transform:translate(-50%,0)}
.toast .link{color:var(--bg);text-decoration:underline;text-underline-offset:3px}
.toast .muted{color:color-mix(in srgb,var(--bg) 65%,transparent);font-weight:500}
.tpill{position:fixed;left:50%;bottom:28px;z-index:70;transform:translate(-50%,160%);visibility:hidden;display:flex;align-items:center;gap:12px;padding:7px 7px 7px 18px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:0 18px 40px -12px rgba(0,0,0,.55);transition:transform .7s var(--spring);max-width:calc(100vw - 24px)}
.tpill.on{transform:translate(-50%,0);visibility:visible}
.tpill .tt{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent);min-width:58px}
.tpill .tn{font-size:13px;color:var(--muted);max-width:36vw;cursor:pointer}
.tpill .ibtn{width:38px;height:38px;border-radius:50%}
@media(max-width:820px){.tpill{bottom:calc(96px + env(safe-area-inset-bottom))}}
.burst{position:fixed;left:50%;top:40%;z-index:95;pointer-events:none}
.burst i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--k);animation:fly 1.3s var(--ease) forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.lock{position:fixed;inset:0;z-index:59;display:grid;place-items:center;background:var(--bg);padding:24px}
.lock .box{width:min(340px,100%);text-align:center}
.lock h2{font:800 44px/.9 var(--f-display);text-transform:uppercase;margin:22px 0 8px}
.lock .logo{width:64px;height:64px;margin:0 auto}
.pin-in{text-align:center;font:800 32px var(--f-display);letter-spacing:.45em;margin:20px 0 8px}
.err{color:#FF7A7A;font-size:13.5px;margin-top:8px}

/* ================= horizontal timelines ================= */
.seg-c button svg{width:18px;height:18px;display:block}
.seg-c.ico button{padding:8px 11px}
.hs-shell{position:relative;margin:0 calc(-1 * var(--gutter))}
.hs{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:34px 0 10px;outline:none;cursor:grab}
.hs.hs-drag{cursor:grabbing}
.hs{-webkit-user-select:none;user-select:none}.hs img{-webkit-user-drag:none}
.hs::-webkit-scrollbar{display:none}
.hs-row{position:relative;display:flex;align-items:flex-start;gap:var(--hs-gap);width:max-content;--hs-w:min(76vw,344px);--hs-gap:18px;--node:34px}
@media(min-width:821px){.hs-row{--hs-w:360px;--hs-gap:28px}}
@media(max-width:620px){.hs-row{--node:28px}}
.hs-sp{flex:none;width:40px}
.hs-item{flex:none;width:var(--hs-w);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center}
.hs-card{width:100%;aspect-ratio:4/5;will-change:transform,opacity;transform-origin:50% 60%;display:block;background:none;border:0;padding:0;color:inherit;font:inherit}
.hs-card>*{height:100%}
.hs-card .fc{height:100%}
.hs-card .fc-face{padding:22px;border-radius:30px}
.hs-card .fc-n{font-size:clamp(110px,32vw,150px)}
.hs-card .fc-t{font:800 clamp(26px,7vw,32px)/.96 var(--f-display);text-transform:uppercase;-webkit-line-clamp:3}
.hs-stem{width:2px;height:24px;margin-top:2px;background:linear-gradient(color-mix(in srgb,var(--c,var(--accent)) 85%,transparent),transparent)}
.hs-lab{margin-top:10px;text-align:center;white-space:nowrap}
.hs-line,.hs-fill{position:absolute;left:0;height:2px;margin-top:-1px;top:calc(var(--hs-w) * 1.25 + 26px + var(--node) / 2)}
.hs-line{right:0;background:repeating-linear-gradient(90deg,var(--line-2) 0 4px,transparent 4px 11px)}
.hs-fill{width:0;background:var(--c,var(--accent));box-shadow:0 0 12px var(--c,var(--accent)),0 0 26px color-mix(in srgb,var(--c,var(--accent)) 50%,transparent);border-radius:2px;transition:width 1.3s var(--ease)}
.hs-item .node{width:var(--node);height:var(--node)}
.hs-foot{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.hs-count{min-width:76px;text-align:center}
.hs-item.add .hs-card{border:1.5px dashed var(--line-2);border-radius:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:border-color .3s,color .3s}
.hs-item.add .hs-card:hover{border-color:var(--accent);color:var(--text)}
.hs-item.add svg{width:36px;height:36px}
/* big step card */
.sc.big,.sc.big .sc-in{height:100%}
.sc.big .sc-face{min-height:0;height:100%;padding:22px 22px 20px;border-radius:30px}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc.big .sc-n{font-size:clamp(112px,34vw,158px);margin-top:auto;line-height:.76;letter-spacing:-.02em}
.sc.big .sc-t{font:800 clamp(26px,7.4vw,33px)/.96 var(--f-display);text-transform:uppercase;margin:16px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.sc-foot .data{display:flex;gap:6px;align-items:center}
.flip-hint{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--t-fg,currentColor) 24%,transparent)}
.flip-hint svg{width:16px;height:16px}
.sc.big .sc-back.tint{background:var(--t-bg);border:1px solid var(--t-bd);padding:22px;gap:10px;background-size:auto;animation:none}
.sc.big .sc-back h4{font:800 28px/.95 var(--f-display);text-transform:uppercase;margin:4px 0 6px}
.sc.big .note{font-size:14.5px;line-height:1.5;overflow:auto;flex:1;min-height:0}
.sc.big .sc-act{flex-direction:column;gap:8px}
.sc.big .sc-act .btn{width:100%;flex:none}
/* flip: lift + light sweep */
.sc,.fc{position:relative}
.sc::after,.fc::after{content:'';position:absolute;inset:0;z-index:5;border-radius:26px;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.34) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:160% 0;opacity:0}
.flipping::after{animation:sheen .9s var(--ease)}
@keyframes sheen{0%{opacity:0;background-position:160% 0}25%{opacity:1}100%{opacity:0;background-position:-60% 0}}
.flipping{animation:lift .9s var(--ease)}
@keyframes lift{45%{transform:scale(.93) translateY(-6px)}}
/* big journal card */
.jb{height:100%;border-radius:30px;padding:22px;display:flex;flex-direction:column;overflow:hidden;position:relative}

.jb .jg{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:600;text-decoration:none;color:inherit;opacity:.72}
.jb .x{margin-left:auto;background:none;border:0;color:inherit;opacity:.55;cursor:pointer;padding:2px;display:grid}
.jb .x svg{width:16px;height:16px}
.jb.photo{padding:0;color:#fff;background:#000}
.jb.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.jb.photo .jb-ov{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 22px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.jb.photo .data{color:rgba(255,255,255,.78)}

.cprev-n{font:800 54px/.8 var(--f-display)}

.sc.big .sc-t{font:800 clamp(42px,11.6vw,60px)/.9 var(--f-display);margin:auto 0 0;-webkit-line-clamp:5}
.cp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}

/* ================= pull down to sync ================= */

::view-transition-old(hero),::view-transition-new(hero){animation-duration:.6s;height:100%;object-fit:cover}
[data-motion=reduced] *,[data-motion=reduced] *::before,[data-motion=reduced] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ================= nested goals ================= */
[hidden]{display:none!important}

<script>
/* ================= utils ================= */
const $=s=>document.querySelector(s);

const daysUntil=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)};
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',...(y!==new Date().getFullYear()?{year:'numeric'}:{})})};

/* ================= model ================= */
const G=id=>S.goals.find(g=>g.id===id);
const active=()=>S.goals.filter(g=>g.status==='active');
const kids=g=>S.goals.filter(x=>x.parent===g.id&&x.id!==g.id);
const prog=(g,dep=0)=>{const k=dep<8?kids(g):[],n=g.steps.length+k.length;if(!n)return g.status==='done'?1:0;return(g.steps.filter(s=>s.done).length+k.reduce((a,x)=>a+(x.status==='done'?1:prog(x,dep+1)),0))/n};
/* nesting: ancestors (nearest first), all descendants, and a depth-first tree order */
const ancestors=g=>{const out=[];let p=g&&G(g.parent);while(p&&out.length<12&&!out.includes(p)&&p!==g){out.push(p);p=G(p.parent)}return out};
const descendants=g=>{const out=[],q=[g];while(q.length&&out.length<500){const x=q.shift();kids(x).forEach(k=>{if(!out.includes(k)&&k!==g){out.push(k);q.push(k)}})}return out};
function treeOrder(list){const ids=new Set(list.map(g=>g.id)),out=[],seen=new Set();const walk=(g,d)=>{if(seen.has(g.id))return;seen.add(g.id);out.push({g,d});list.filter(x=>x.parent===g.id).forEach(x=>walk(x,d+1))};list.filter(g=>!g.parent||!ids.has(g.parent)).forEach(g=>walk(g,0));list.forEach(g=>walk(g,0));return out}
const pct=g=>Math.round(prog(g)*100);
const nextStep=g=>g.status==='active'?g.steps.find(s=>!s.done):null;
function newGoal(o={}){return{img:o.img||'',parent:typeof o.parent==='string'?o.parent:'',id:uid(),title:String(o.title||'Untitled goal').trim(),why:String(o.why||'').trim(),area:areaKey(o.area)||'personal',horizon:HZ_IDS.includes(o.horizon)?o.horizon:'month',priority:[1,2,3].includes(+o.priority)?+o.priority:2,pinned:!!o.pinned,startDate:validDate(o.startDate)||ymd(),targetDate:validDate(o.targetDate),checkin:o.checkin||'',checkinTime:o.checkinTime||'19:00',checkinDay:o.checkinDay!=null?+o.checkinDay:1,lastCheckin:ymd(),status:'active',steps:(o.steps||[]).map(s=>({id:uid(),title:String(s.title||'Step').trim(),due:validDate(s.due),time:s.time||'',remind:s.remind??'',reminded:false,note:s.note||'',done:false,doneAt:null})),links:[],createdAt:Date.now(),completedAt:null}}
function log(type,goalId,text,t=Date.now(),sid=null,img=null){S.entries.push({id:uid(),t,type,goalId,text,sid,img})}
function linkGoals(a,b){if(!a.links.includes(b.id))a.links.push(b.id);if(!b.links.includes(a.id))b.links.push(a.id)}
function unlinkGoals(a,b){a.links=a.links.filter(x=>x!==b.id);b.links=b.links.filter(x=>x!==a.id)}
function completeGoal(g){g.status='done';g.completedAt=Date.now();log('goal-done',g.id,g.title);burst();toast(`Goal achieved: ${esc(trunc(g.title,36))}`);const p=G(g.parent);if(p&&p.status==='active'&&p!==g&&prog(p)>=1)setTimeout(()=>{completeGoal(p);save();render(false)},900)}

function dueText(s){if(!s.due)return'';const n=daysUntil(s.due);return(n<0?`${-n} day${n===-1?'':'s'} late`:n===0?'Due today':n===1?'Due tomorrow':n<7?`Due in ${n} days`:'Due '+fmtDate(s.due))+(s.time?' · '+fmtTime(s.time):'')}

/* ================= CALENDAR ================= */
let CAL={d:ymd(),dir:0};
const dUTC=n=>new Date(n*864e5);
const monthOf=n=>{const d=dUTC(n),y=d.getUTCFullYear(),m=d.getUTCMonth();return[Math.round(Date.UTC(y,m,1)/864e5),Math.round(Date.UTC(y,m+1,1)/864e5)-1]};
function calSpan(){const n=dnum(CAL.d),v=S.settings.layout.cal;if(v==='day')return[n,n];if(v==='week'){const a=n-dUTC(n).getUTCDay();return[a,a+6]}return monthOf(n)}
function calItems(a,b){const M={};const add=(n,it)=>{if(n<a||n>b)return;(M[n]=M[n]||[]).push(it)};
 S.days.forEach(x=>{const g=x.goalId&&G(x.goalId)||null;add(dnum(x.date),{k:'day',id:x.id,x,g,t:x.title,time:x.time||'',done:!!x.done,sub:g?g.title:''})});
 S.goals.forEach(g=>{g.steps.forEach(st=>{if(!st.due)return;const n0=dnum(st.due);add(n0,{k:'step',g,s:st,t:st.title,time:st.time||'',done:!!st.done,sub:g.title});
   if(st.repeat&&!st.done&&g.status==='active'&&!g.steps.some(y=>y.from===st.id&&!y.done)){const d=dUTC(n0);for(let i=0;i<1500;i++){if(st.repeat==='daily')d.setUTCDate(d.getUTCDate()+1);else if(st.repeat==='weekly')d.setUTCDate(d.getUTCDate()+7);else d.setUTCMonth(d.getUTCMonth()+1);const n=Math.round(d.getTime()/864e5);if(n>b)break;add(n,{k:'rep',g,s:st,t:st.title,time:st.time||'',done:false,sub:g.title})}}});
  if(g.targetDate)add(dnum(g.targetDate),{k:'target',g,t:g.title,time:'',done:g.status==='done',sub:g.status==='done'?'Achieved':pct(g)+'% there'})});
 for(const k in M)M[k].sort((x,y)=>(x.k==='target')-(y.k==='target')||byTime(x,y));return M}
const calOpen=x=>x.k==='day'?`data-act="editDay" data-id="${x.id}"`:x.k==='target'?`data-act="open" data-id="${x.g.id}"`:`data-act="editStep" data-g="${x.g.id}" data-s="${x.s.id}"`;
const calChip=x=>`<button class="cchip k-${x.k}${x.done?' d':''}" style="--c:${colOf(x.g)}" ${calOpen(x)}><b>${x.k==='target'?'⚑ ':''}${esc(x.t)}</b>${x.time||x.k==='rep'?`<span>${x.time?fmtTime(x.time):''}${x.k==='rep'?(x.time?' · ':'')+'repeats':''}</span>`:''}</button>`;
function calMonth(){const n=dnum(CAL.d),[f,l]=monthOf(n),a=f-dUTC(f).getUTCDay(),b=l+6-dUTC(l).getUTCDay(),M=calItems(a,b),tn=dnum(ymd());let h=`<div class="cal-dow">${DAYS.map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-m">`;
 for(let k=a;k<=b;k++){const it=M[k]||[];const dd=dUTC(k);h+=`<button class="cd${k<f||k>l?' out':''}${k===tn?' now':''}${k===n?' pk':''}" data-act="calPick" data-d="${fromN(k)}" aria-label="${dd.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'})}${it.length?', '+it.length+' planned':''}"><span class="cd-n">${dd.getUTCDate()}</span><span class="cd-dots">${it.slice(0,4).map(x=>`<i style="background:${colOf(x.g)}"${x.done?' class="d"':''}></i>`).join('')}</span><span class="cd-chips">${it.slice(0,3).map(x=>`<em style="--c:${colOf(x.g)}"${x.done?' class="d"':''}>${esc(x.t)}</em>`).join('')}${it.length>3?`<em class="more">+${it.length-3} more</em>`:''}</span></button>`}
 return h+'</div>'}
function calWeek(){const n=dnum(CAL.d),a=n-dUTC(n).getUTCDay(),M=calItems(a,a+6),tn=dnum(ymd());let h='<div class="cal-w">';
 for(let k=a;k<=a+6;k++){const it=M[k]||[];const dd=dUTC(k);h+=`<div class="cw${k===tn?' now':''}${k===n?' pk':''}"><button class="cw-h" data-act="calPick" data-d="${fromN(k)}"><span class="data">${DAYS[dd.getUTCDay()]}</span><b>${dd.getUTCDate()}</b></button><div class="cw-i">${it.map(calChip).join('')||'<span class="cw-e">Free</span>'}</div></div>`}

const ZMIN=.5,ZMAX=3.2;
const calPpm=()=>Math.min(ZMAX,Math.max(ZMIN,+S.settings.layout.calPpm||1));
const hourLbl=h=>new Date(2000,0,1,h).toLocaleTimeString([],{hour:'numeric'});
const minTime=m=>fmtTime(pad2(Math.floor(m/60)%24)+':'+pad2(m%60));
function dayGrid(n,it){const tn=dnum(ymd()),ppm=calPpm();const all=it.filter(x=>!x.time),ev=it.filter(x=>x.time).map(x=>{const[h,m]=x.time.split(':').map(Number);const st=h*60+m,du=x.k==='day'?(+x.x.dur||30):30;return{x,s:st,e:Math.min(1440,st+du)}}).sort((a,b)=>a.s-b.s||b.e-a.e);
 const groups=[];let cl=[],end=-1;ev.forEach(o=>{const oe=Math.max(o.e,o.s+26);if(o.s>=end&&cl.length){groups.push(cl);cl=[]}cl.push(o);end=Math.max(end,oe)});if(cl.length)groups.push(cl);
 groups.forEach(g=>{const lanes=[];g.forEach(o=>{let k=lanes.findIndex(le=>le<=o.s);if(k<0){k=lanes.length;lanes.push(0)}lanes[k]=Math.max(o.e,o.s+26);o.k=k});g.forEach(o=>o.n=lanes.length)});
 let h='';for(let i=0;i<24;i++)h+=`<div class="tg-hr" style="top:calc(${i*60} * var(--ppm))"><span>${hourLbl(i)}</span></div><div class="tg-hr half" style="top:calc(${i*60+30} * var(--ppm))"></div>`;

/* ================= TIMELINE (roadmap) ================= */
let RD={zoom:'quarter',open:new Set(),show:'active',scroll:null,todayX:0,key:null,pulse:null};
const PPD={month:24,quarter:7,year:2.2};
const HZ_DAYS={week:7,month:30,quarter:90,year:365,multi:1095,life:3650};
function gSpan(g){const s=dnum(g.startDate||ymd(new Date(g.createdAt)));const dues=g.steps.filter(x=>x.due).map(x=>dnum(x.due));let e=g.targetDate?dnum(g.targetDate):(dues.length?Math.max(...dues):s+HZ_DAYS[g.horizon]);if(dues.length)e=Math.max(e,...dues);return{s:Math.min(s,...dues),e:Math.max(e,s+1)}}
function stepXs(g,sp){const n=g.steps.length;return g.steps.map((st,i)=>st.due?dnum(st.due):sp.s+(i+1)/(n+1)*(sp.e-sp.s))}
function ppdFitMany(L){const tn=dnum(ymd());let lo=tn-14,hi=tn+45;L.forEach(g=>{const sp=gSpan(g);lo=Math.min(lo,sp.s-7);hi=Math.max(hi,sp.e+21)});return Math.min(30,Math.max(2.4,760/(hi-lo)))}
function ppdFit(g){const sp=gSpan(g),tn=dnum(ymd());const lo=Math.min(tn-14,sp.s-7),hi=Math.max(tn+45,sp.e+21);return Math.min(30,Math.max(2.4,760/(hi-lo)))}
const FLW=320;
function flY(x,xs,xe,yc,A,ph){const env=Math.max(0,Math.min(1,(x-xs)/80,(xe-x)/80));return yc+A*env*Math.sin((x-xs)/FLW*2*Math.PI+ph)}
function flPath(a,b,xs,xe,yc,A,ph){if(b<a)b=a;const st=Math.max(3,Math.min(9,(b-a)/30));let d='';for(let x=a;;x+=st){if(x>b)x=b;d+=(d?'L':'M')+x.toFixed(1)+' '+flY(x,xs,xe,yc,A,ph).toFixed(1);if(x>=b)break}return d}
function laneHTML(g,x0,ppd,open,W,i=0,single=false){const sp=gSpan(g),p=prog(g),tn=dnum(ymd());const xs=(sp.s-x0)*ppd,w=Math.max(8,(sp.e-sp.s)*ppd),xe=xs+w,xp=xs+w*p;
 const H=single?(open?250:120):(open?264:98),yc=single?H/2:(open?152:66),A=open?(single?30:24):11,ph=(i*1.9+.6)%(2*Math.PI);const Y=x=>flY(x,xs,xe,yc,A,ph).toFixed(1),at=x=>Math.round(Math.max(0,Math.min(1,(x-xs)/w))*1700)+'ms';
 const X=stepXs(g,sp);let marks='';
 if(open){const last=[-1e9,-1e9,-1e9,-1e9],slot=[];X.map((x,k)=>k).sort((a,b)=>X[a]-X[b]).forEach(k=>{const px=(X[k]-x0)*ppd;let q=[0,1,2,3].find(q=>px-last[q]>=142);if(q==null)q=last.indexOf(Math.min(...last));slot[k]=q;last[q]=px});
  marks=g.steps.map((st,k)=>{const px=(X[k]-x0)*ppd,over=!st.done&&st.due&&dnum(st.due)<tn;return`<button class="spl fl-pop ${st.done?'done':''} ${st.due?'':'nodate'} ${over?'over':''} ${['up','dn','up far','dn far'][slot[k]]}" style="left:${px.toFixed(1)}px;top:${Y(px)}px;--at:${at(px)}" data-act="editStep" data-g="${g.id}" data-s="${st.id}"><b></b><span>${esc(trunc(st.title,38))}<em>${st.done?'Done':st.due?fmtDate(st.due)+(st.time?' · '+fmtTime(st.time):''):'No date'}</em></span></button>`}).join('')}
 else marks=g.steps.map((st,k)=>{const px=(X[k]-x0)*ppd;return`<span class="fl-st fl-pop${st.done?' d':''}" style="left:${px.toFixed(1)}px;top:${Y(px)}px;--at:${at(px)}"></span>`}).join('');
 const gid='fg-'+g.id,base=flPath(xs,xe,xs,xe,yc,A,ph),r=10,C=2*Math.PI*r;
 const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${xs.toFixed(1)}" x2="${Math.max(xp,xs+1).toFixed(1)}" y1="0" y2="0"><stop offset="0" style="stop-color:var(--c);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--c)"/></linearGradient></defs><path class="fl-base" pathLength="1" d="${base}"/>${p>0?`<path class="fl-prog" pathLength="1" stroke="url(#${gid})" d="${flPath(xs,xp,xs,xe,yc,A,ph)}"/>`:''}${single?'':`<path class="fl-hit" data-act="laneToggle" data-id="${g.id}" d="${base}"/>`}</svg>`;
 const chip=single?'':`<div class="fl-chip" role="button" tabindex="0" data-act="laneToggle" data-id="${g.id}" aria-expanded="${open}"><svg class="pr" viewBox="0 0 28 28"><circle class="a" cx="14" cy="14" r="${r}"/><circle class="b" cx="14" cy="14" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-p)).toFixed(2)}"/></svg><span class="tx"><b>${esc(g.title)}</b><span class="data">${pct(g)}% · ${fmtDate(fromN(sp.s))} → ${g.targetDate?fmtDate(g.targetDate):fmtDate(fromN(sp.e))}</span></span>${open?`<a class="link" href="#/goal/${g.id}" data-act="open" data-id="${g.id}">Open</a>`:''}</div>`;
 return`<div class="fl-row${open?' open':''}${haloOn(g)?' halo':''}${RD.pulse===g.id?' draw':''}" style="${cvar(g)};height:${H}px;--i:${RD.pulse===g.id?0:i}">${chip}${svg}<span class="fl-dot fl-pop" style="left:${xs.toFixed(1)}px;top:${Y(xs)}px"></span><span class="fl-end fl-pop" style="left:${xe.toFixed(1)}px;top:${Y(xe)}px;--at:1700ms"></span>${marks}${g.status==='active'?`<span class="fl-ship fl-pop" style="left:${xp.toFixed(1)}px;top:${Y(xp)}px;--at:${p>0?2000:200}ms"></span>`:''}</div>`}

const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
const icsTrig=min=>min>=0?'TRIGGER:PT'+min+'M':'TRIGGER:-PT'+(-min)+'M';
function ics(evs){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Plotline//EN','CALSCALE:GREGORIAN'];const st=icsStamp();
 evs.forEach(e=>{const d=e.date.replace(/-/g,'');const rem=+e.remind||0;L.push('BEGIN:VEVENT','UID:'+e.uid+'@plotline','DTSTAMP:'+st);
  if(e.time)L.push('DTSTART:'+d+'T'+e.time.replace(':','')+'00','DURATION:PT30M');else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+fromN(dnum(e.date)+1).replace(/-/g,''));
  L.push('SUMMARY:'+icsEsc(e.title),'DESCRIPTION:'+icsEsc(e.desc),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),e.time?icsTrig(-rem):icsTrig(540-rem),'END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');return L.join('\r\n')}
const stepEvent=(g,s)=>({uid:s.id,date:s.due,time:s.time,remind:s.remind,title:`${s.title} — ${g.title}`,desc:`Plotline step for "${g.title}".${s.note?' '+s.note:''}`});
function readImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('waypoints:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'f'+h}}
function askNotif(){if(NATIVE){try{if(!NATIVE.notificationsGranted())NATIVE.requestNotifications()}catch(e){}return}try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.start(t);o.stop(t+.45)})}catch(e){}}
function notify(title,body){toast(`${ic('bell','ico-s')} ${esc(title)}${body?` <span class="muted">· ${esc(body)}</span>`:''}`);vib();beep();try{if(!NATIVE&&'Notification'in window&&Notification.permission==='granted')new Notification(title,{body,tag:title})}catch(e){}}
function reminderAt(s){if(!s.due||s.remind===''||s.remind==null)return null;const[y,m,d]=s.due.split('-').map(Number);const[hh,mm]=(s.time||'09:00').split(':').map(Number);return new Date(y,m-1,d,hh,mm).getTime()-(+s.remind)*6e4}

function pushWidget(){if(!NATIVE||!NATIVE.widget)return;const COL={health:'#46C99B',career:'#6B9BFF',family:'#FF8C6B',faith:'#F0C862',finance:'#A9D14A',learning:'#AC93FF',personal:'#F585B8'};const cg=g=>g&&COL[areaOf(g.area).k]||'#FFB547';
 const nx=active().map(g=>({g,s:nextStep(g)})).filter(x=>x.s).sort(urgency).slice(0,4).map(({g,s})=>({t:s.title,g:g.title,d:s.due?dueShort(s):'',late:dueCls(s)==='over',c:cg(g),gid:g.id,sid:s.id,time:s.time?fmtTime(s.time):''}));
 const tn=dnum(ymd());const days=S.days.filter(x=>{const n=dnum(x.date);return n>=tn-1&&n<=tn+8}).sort(byTime).map(x=>({id:x.id,t:x.title,d:x.date,done:!!x.done,time:x.time?fmtTime(x.time):'',c:cg(x.goalId&&G(x.goalId))}));
 const M=calItems(tn-7,tn+21),counts={};for(const k in M)counts[fromN(+k)]=M[k].length;
 const up=[];for(let k=tn;k<=tn+21&&up.length<8;k++)(M[k]||[]).forEach(x=>{if(!x.done&&up.length<8)up.push({t:x.t,d:fromN(k),time:x.time?fmtTime(x.time):'',c:cg(x.g),k:x.k,g:x.g?x.g.title:'',id:x.k==='day'?x.id:'',sid:x.s?x.s.id:''})});
 const goals=active().sort((a,b)=>(b.pinned-a.pinned)||(a.priority-b.priority)||(prog(b)-prog(a))).slice(0,4).map(g=>{const n=nextStep(g);return{id:g.id,t:g.title,p:pct(g),c:cg(g),a:areaName(g.area),n:n?n.title:'All steps done'}});
 try{NATIVE.widget(JSON.stringify({name:S.settings.name||'',items:nx,days,counts,up,goals,...widgetHabits()}))}catch(e){}}

function applyWidgetQueue(){if(!NATIVE||!NATIVE.widgetQueue)return;let q=[];try{q=JSON.parse(NATIVE.widgetQueue()||'[]')}catch(e){}if(!q.length)return;let n=0;
 q.forEach(a=>{if(a.k==='day'){const x=S.days.find(y=>y.id===a.id);if(x&&!!x.done!==!!a.done){x.done=!!a.done;x.doneAt=x.done?(a.at||Date.now()):null;n++}}

function syncNative(){if(!NATIVE)return;const now=Date.now(),L=[];
 S.goals.forEach(g=>{if(g.status!=='active')return;g.steps.forEach(s=>{if(s.done)return;const t=reminderAt(s);if(t!=null&&t>now)L.push({at:t,title:s.title,body:g.title+(s.time?' · '+fmtTime(s.time):'')})});
  if(g.checkin){const[hh,mm]=(g.checkinTime||'19:00').split(':').map(Number);for(let k=0;k<35;k++){const d=new Date();d.setDate(d.getDate()+k);d.setHours(hh,mm,0,0);if(d.getTime()<=now)continue;if(k===0&&g.lastCheckin===ymd())continue;if(g.checkin==='weekly'&&d.getDay()!==+g.checkinDay)continue;const n=nextStep(g);L.push({at:d.getTime(),title:'Check in: '+g.title,body:n?'Next: '+n.title:'How is it going?'})}}});
 const t=S.settings.timer;if(t&&t.end>now){const g=G(t.g),s=g&&g.steps.find(x=>x.id===t.s);L.push({at:t.end,title:'Focus session complete',body:s?`${t.m} min on “${s.title}”`:''})}
 S.days.forEach(x=>{if(x.done||!x.time)return;const[y,m,d]=x.date.split('-').map(Number),[hh,mm]=x.time.split(':').map(Number),at=new Date(y,m-1,d,hh,mm).getTime();if(at>now)L.push({at,title:x.title,body:'Goal for today'})});

function tick(){const now=Date.now(),td=ymd();let ch=false;
 S.goals.forEach(g=>{if(g.status!=='active')return;
  g.steps.forEach(s=>{if(s.done||s.reminded)return;const t=reminderAt(s);if(t!=null&&t<=now){if(now-t<2*864e5)notify(s.title,`${g.title}${s.time?' · '+fmtTime(s.time):''}`);s.reminded=true;ch=true}});

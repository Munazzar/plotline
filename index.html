/* ================= forms ================= */
function parentOptions(g,sel){const bad=g?new Set([g.id,...descendants(g).map(x=>x.id)]):new Set();return`<option value="">None · a main goal</option>${treeOrder(S.goals.filter(x=>!bad.has(x.id))).map(({g:x,d})=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${'\u2003'.repeat(d)}${d?'↳ ':''}${esc(trunc(x.title,48))}</option>`).join('')}`}
function goalForm(g,parent){const e=!!g;g=g||{title:'',why:'',area:'personal',horizon:'month',priority:2,startDate:ymd(),targetDate:'',pinned:false,checkin:'',checkinTime:'19:00',checkinDay:1,parent:parent||''};
 return`<h2>${e?'Edit goal':'New goal'}</h2><form data-form="saveGoal" data-id="${e?g.id:''}">
 <div class="field"><label>What do you want to achieve?</label><input name="title" required maxlength="80" value="${esc(g.title)}" placeholder="Run a 10K race"></div>
 <div class="field"><label>Why it matters</label><textarea name="why" placeholder="Your future self will read this on hard days.">${esc(g.why)}</textarea></div>
 <div class="two"><div class="field"><label>Life area</label>${areaInput('area',g.area)}</div><div class="field"><label>Horizon</label><select name="horizon">${HORIZONS.map(([k,n])=>`<option value="${k}" ${k===g.horizon?'selected':''}>${n}</option>`).join('')}</select></div></div>
 ${S.goals.some(x=>!e||x.id!==g.id)?`<div class="field"><label>Part of a bigger goal · optional</label><select name="parent">${parentOptions(e?g:null,g.parent||'')}</select></div>`:''}
 <div class="field"><label>Priority</label><div class="radios">${[[1,'High'],[2,'Medium'],[3,'Low']].map(([v,n])=>`<label><input type="radio" name="priority" value="${v}" ${g.priority===v?'checked':''}><span>${n}</span></label>`).join('')}</div></div>
 <div class="two"><div class="field"><label>Start date</label><input type="date" name="startDate" required value="${g.startDate||ymd()}"></div><div class="field"><label>Target date</label><input type="date" name="targetDate" value="${g.targetDate||''}"></div></div>
 ${e?`<label class="sw" style="border:0;padding-top:0"><span>Move steps with the start date<small>Open steps and the target date shift by the same number of days</small></span><input type="checkbox" name="shift" checked><i></i></label>`:`<div class="field"><label>First steps · one per line</label><textarea name="steps" placeholder="Get fitted for running shoes&#10;Run 20 minutes, 3 times this week"></textarea></div><div class="field"><label>Space those steps</label><select name="pace"><option value="0">No dates yet</option><option value="1">One per day</option><option value="3">Every 3 days</option><option value="7" selected>Every week</option><option value="14">Every 2 weeks</option><option value="30">Every month</option></select></div>`}
 <div class="two"><div class="field"><label>Check-in reminder</label><select name="checkin"><option value="" ${!g.checkin?'selected':''}>Off</option><option value="daily" ${g.checkin==='daily'?'selected':''}>Every day</option><option value="weekly" ${g.checkin==='weekly'?'selected':''}>Every week</option></select></div><div class="field"><label>At</label><input type="time" name="checkinTime" value="${g.checkinTime||'19:00'}"></div></div>
 <div class="field" data-weekly ${g.checkin==='weekly'?'':'hidden'}><label>On</label><div class="radios sm">${DAYS.map((d,i)=>`<label><input type="radio" name="checkinDay" value="${i}" ${+g.checkinDay===i?'checked':''}><span>${d.slice(0,2)}</span></label>`).join('')}</div></div>
 <div class="field"><label>Cover image · optional</label><div class="cover-row"><label class="btn">${ic('camera')}<span id="cvLbl">${g.img?'Change cover':'Add a cover image'}</span><input type="file" accept="image/*" data-file="cover" hidden></label>${g.img?`<button type="button" class="btn ghost danger" data-act="rmCover">Remove</button>`:''}</div><img id="cvPrev" class="ph-prev" alt="" ${g.img?`src="${g.img}"`:'hidden'}></div>
 <label class="sw"><span>Pin to Today</span><input type="checkbox" name="pinned" ${g.pinned?'checked':''}><i></i></label>
 <div class="actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn pri">${e?'Save changes':'Create goal'}</button></div></form>`}
function stepForm(g,s){const e=!!s;s=s||{title:'',due:'',time:'',remind:'',note:''};const a=e?`data-g="${g.id}" data-s="${s.id}"`:`data-g="${g.id}"`;
 return`<div class="data">${esc(g.title)}</div><h2 style="margin-top:8px">${e?'Edit step':'New step'}</h2><form data-form="saveStep" ${a}><div class="field"><label>Step</label><input name="title" required maxlength="100" value="${esc(s.title)}" placeholder="One concrete action"></div>
 <div class="field"><label>Due</label><div class="chips">${[[0,'Today'],[1,'Tomorrow'],[3,'3 days'],[7,'1 week'],[14,'2 weeks'],[30,'1 month'],['','No date']].map(([n,l])=>`<button type="button" class="chip" data-act="dueIn" data-n="${n}">${l}</button>`).join('')}</div></div>
 <div class="two"><div class="field"><label>Date</label><input type="date" name="due" value="${s.due||''}"></div><div class="field"><label>Time · optional</label><input type="time" name="time" value="${s.time||''}"></div></div>
 <div class="field"><label>Repeat</label><div class="radios sm">${[['','Never'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(([v,n])=>`<label><input type="radio" name="repeat" value="${v}" ${(s.repeat||'')===v?'checked':''}><span>${n}</span></label>`).join('')}</div></div>
 <div class="field"><label>Reminder</label><select name="remind">${[['','No reminder'],['0','At due time'],['15','15 minutes before'],['60','1 hour before'],['1440','1 day before'],['10080','1 week before']].map(([v,l])=>`<option value="${v}" ${String(s.remind??'')===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="field"><label>Notes</label><textarea name="note" placeholder="Details, links, how you’ll do it">${esc(s.note)}</textarea></div>
 ${e?`<div class="field"><label>Focus timer${s.focus?` · ${s.focus} min so far`:''}</label><div class="chips">${[5,15,25,45,60].map(m=>`<button type="button" class="chip" data-act="startTimer" ${a} data-m="${m}">${m} min</button>`).join('')}</div></div>
 <div class="chips" style="margin-top:4px"><button type="button" class="chip" data-act="moveStep" ${a} data-d="-1">${ic('up')}Earlier</button><button type="button" class="chip" data-act="moveStep" ${a} data-d="1">${ic('down')}Later</button><button type="button" class="chip" data-act="icsStep" ${a}>${ic('cal')}Add to calendar</button><button type="button" class="chip" data-act="delStep" ${a} style="color:#FF7A7A">${ic('trash')}Delete</button></div>`:''}
 <div class="actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn pri">${e?'Save':'Add step'}</button></div></form>`}

/* ================= actions ================= */
const ACT={
 open:(d,el)=>{const c=el.closest('[data-vt]')||document.querySelector(`[data-vt="${d.id}"]`);if(c&&!reduced())c.style.viewTransitionName='hero';go('goal/'+d.id)},
 close:closeSheet,
 flip:(d,el)=>{const it=el.closest('.hs-item'),hs=el.closest('.hs');if(it&&hs&&!it.classList.contains('center')){hs.scrollTo({left:it.offsetLeft+it.offsetWidth/2-hs.clientWidth/2,behavior:reduced()?'auto':'smooth'});return}
  document.querySelectorAll('.fc.flip,.sc.flip,.jf.flip').forEach(x=>{if(x!==el)x.classList.remove('flip')});el.classList.toggle('flip');el.classList.remove('flipping');void el.offsetWidth;if(!reduced())el.classList.add('flipping');setTimeout(()=>el.classList.remove('flipping'),950);vib()},
 layout:d=>{S.settings.layout[d.k]=d.v;save();render(false)},
 cardStyle:d=>{S.settings.cards=d.k;save();applyTheme(true);render(false)},
 hsNav:(d,el)=>hsGo(el.closest('.hs-shell'),+d.d),
 newGoal:d=>{COVER=undefined;openSheet(goalForm(null,d&&d.parent))},editGoal:d=>{COVER=undefined;openSheet(goalForm(G(d.id)))},
 rmCover:()=>{COVER='';const p=$('#cvPrev');if(p)p.hidden=true;$('#cvLbl').textContent='Add a cover image'},
 cardBg:d=>{if(d.k==='image'&&!S.settings.cardImg){document.querySelector('[data-file=cardimg]')?.click();return}S.settings.cardBg=d.k;save();applyTheme();render(false)},
 clearCardImg:()=>{S.settings.cardImg='';if(S.settings.cardBg==='image')S.settings.cardBg='plain';save();applyTheme();render(false);toast('Image removed')},
 confirmOk:()=>{const f=CONF;CONF=null;closeSheet();f&&f()},
 undo:()=>{if(UNDO){UNDO();UNDO=null;$('#toast').classList.remove('on')}},
 toggleDay:d=>{const x=S.days.find(y=>y.id===d.id);if(!x)return;x.done=!x.done;x.doneAt=x.done?Date.now():null;if(x.done){vib();const td=S.days.filter(y=>y.date===x.date);if(x.date===ymd()&&td.length>1&&td.every(y=>y.done)){burst();toast('Every goal for today is done')}}save();render(false)},
 dayMove:d=>{const x=S.days.find(y=>y.id===d.id);if(!x)return;x.date=ymd();save();render(false);toast('Moved to today')},
 editDay:d=>{const x=S.days.find(y=>y.id===d.id);if(x)openSheet(dayForm(x))},
 addDay:d=>openSheet(dayForm(null,d.d||CAL.d,d.t)),
 delDay:d=>{const u=undoPoint();S.days=S.days.filter(y=>y.id!==d.id);closeSheet();save();render(false);toast('Removed',u)},
 calZoom:d=>{const Z=[.5,.75,1,1.4,2,3.2],c=calPpm();const nx=+d.d>0?Z.find(z=>z>c+.01)||ZMAX:[...Z].reverse().find(z=>z<c-.01)||ZMIN;animPpm(nx)},
 calSlot:(d,el,e)=>{if(Date.now()-HSDRAG<300)return;const r=el.getBoundingClientRect(),m=Math.max(0,Math.min(1410,Math.floor((e.clientY-r.top)/calPpm()/30)*30));openSheet(dayForm(null,CAL.d,pad2(Math.floor(m/60))+':'+pad2(m%60)))},
 calView:d=>{S.settings.layout.cal=d.v;save();render(false)},
 calToday:()=>{const t=ymd();CAL.dir=t<CAL.d?-1:t>CAL.d?1:0;CAL.d=t;render(false)},
 calStep:d=>{const k=+d.d,n=dnum(CAL.d),v=S.settings.layout.cal;if(v==='day')CAL.d=fromN(n+k);else if(v==='week')CAL.d=fromN(n+7*k);else{const dd=dUTC(n),f=Math.round(Date.UTC(dd.getUTCFullYear(),dd.getUTCMonth()+k,1)/864e5),[,l]=monthOf(f),tn=dnum(ymd());CAL.d=fromN(tn>=f&&tn<=l?tn:f)}CAL.dir=k;render(false)},
 calPick:d=>{const v=S.settings.layout.cal;if(d.d===CAL.d&&v!=='day'){S.settings.layout.cal='day';save();render(false);return}CAL.d=d.d;render(false);if(v==='month'){const g=document.getElementById('ag-'+d.d);if(g){const r=g.getBoundingClientRect();if(r.top>innerHeight-120||r.top<0)g.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'})}}},
 toggleStep:d=>{const g=G(d.g),s=g&&g.steps.find(x=>x.id===d.s);if(!s)return;s.done=!s.done;s.doneAt=s.done?Date.now():null;
  if(s.done&&s.repeat&&!g.steps.some(x=>x.from===s.id)){const base=s.due&&daysUntil(s.due)>=0?s.due:ymd();const[y,m,dd]=base.split('-').map(Number);const nx=new Date(y,m-1,dd);if(s.repeat==='daily')nx.setDate(nx.getDate()+1);else if(s.repeat==='weekly')nx.setDate(nx.getDate()+7);else nx.setMonth(nx.getMonth()+1);g.steps.splice(g.steps.indexOf(s)+1,0,{id:uid(),from:s.id,title:s.title,due:ymd(nx),time:s.time||'',remind:s.remind??'',reminded:false,note:s.note||'',repeat:s.repeat,done:false,doneAt:null});toast(`Done. Next one is ${dueShort({due:ymd(nx)}).toLowerCase()}`)}
  if(s.done){log('step',g.id,s.title,Date.now(),s.id);vib();if(g.status==='active'&&prog(g)>=1)completeGoal(g)}
  else{S.entries=S.entries.filter(e=>!(e.type==='step'&&e.sid===s.id));if(g.status==='done'){g.status='active';g.completedAt=null;S.entries=S.entries.filter(e=>!(e.type==='goal-done'&&e.goalId===g.id))}}
  save();render(false)},
 pin:(d,el)=>{const g=G(d.id);g.pinned=!g.pinned;save();if(cur.p==='goals'){el.classList.toggle('on',g.pinned)}else render(false);toast(g.pinned?'Pinned to Today':'Unpinned')},
 toggleSearch:()=>{F.search=!F.search;if(!F.search)F.q='';render(false);if(F.search)setTimeout(()=>$('[data-q]')?.focus(),30)},
 filt:d=>{F.v=d.v;render(false)},
 gvMode:d=>{S.settings.layout.goal=d.v;save();render(false)},
 jSteps:d=>{S.settings.jSteps=d.v==='1';save();render(false)},
 laneToggle:d=>{if(cur.p==='goal'){if(d.id!==cur.id)go('goal/'+d.id);return}if(cur.p!=='road')return;RD.open.has(d.id)?RD.open.delete(d.id):RD.open.add(d.id);RD.pulse=reduced()?null:d.id;render(false);RD.pulse=null},
 rdZoom:d=>{RD.zoom=d.v;RD.scroll=null;render(false)},rdShow:d=>{RD.show=d.v;render(false)},
 rdAll:()=>{if(RD.open.size)RD.open.clear();else S.goals.forEach(g=>RD.open.add(g.id));RD.key=null;render(false)},
 rdToday:()=>{const r=$('#road');if(!r)return;r.scrollTo({left:Math.max(0,RD.todayX-.25*(r.clientWidth-labW(r))),behavior:reduced()?'auto':'smooth'});const tl=r.querySelector('.today-line');if(tl){tl.classList.remove('grow');void tl.offsetWidth;tl.classList.add('grow')}},
 mapSel:d=>{MSEL=MSEL===d.id?null:d.id;drawMap();paintCard();const p=MSEL&&ML&&ML.P[MSEL],svg=$('#map');if(p&&svg){const r=svg.getBoundingClientRect();animMap(()=>{T.k=Math.max(T.k,1);T.x=r.width/2-p.x*T.k;T.y=r.height*.38-p.y*T.k})}},
 mapReset:()=>{S.goals.forEach(g=>{delete g.mapPos});S.settings.areaPos={};S.settings.mapSpace=1;MSEL=null;save();render(false);toast('Layout reset')},
 fit:()=>fitMap(true),
 zoom:d=>{const r=$('#map').getBoundingClientRect();animMap(()=>zoomAt(r.width/2,r.height/2,+d.d))},
 addStepSheet:d=>openSheet(stepForm(G(d.id))),
 editStep:d=>{const g=G(d.g),s=g&&g.steps.find(x=>x.id===d.s);if(s)openSheet(stepForm(g,s))},
 dueIn:d=>{const i=$('#sheet [name=due]');if(i)i.value=d.n===''?'':addDays(+d.n)},
 moveStep:d=>{const g=G(d.g),i=g.steps.findIndex(x=>x.id===d.s),j=i+(+d.d);if(j<0||j>=g.steps.length)return;const[s]=g.steps.splice(i,1);g.steps.splice(j,0,s);save();render(false);toast(`Now step ${j+1}`)},
 delStep:d=>{const u=undoPoint();const g=G(d.g);g.steps=g.steps.filter(x=>x.id!==d.s);S.entries=S.entries.filter(e=>e.sid!==d.s);closeSheet();save();render(false);toast('Step deleted',u)},
 icsStep:d=>{const g=G(d.g),s=g.steps.find(x=>x.id===d.s);const f=$('#sheet form');const due=f?.elements.due.value||s.due;if(!due)return toast('Set a date first');s.due=due;if(f){s.time=f.elements.time.value||'';s.remind=f.elements.remind.value}save();download('plotline-step.ics',ics([stepEvent(g,s)]),'text/calendar');toast('Open the file to add it to your calendar')},
 icsGoal:d=>{const g=G(d.id);const ev=g.steps.filter(s=>!s.done&&s.due).map(s=>stepEvent(g,s));closeSheet();if(!ev.length)return toast('Give some steps a date first');download('plotline-goal.ics',ics(ev),'text/calendar');toast(`${ev.length} reminder${ev.length>1?'s':''} ready for your calendar`)},
 icsAll:()=>{const ev=active().flatMap(g=>g.steps.filter(s=>!s.done&&s.due).map(s=>stepEvent(g,s)));if(!ev.length)return toast('No open steps with dates yet');download('plotline-reminders.ics',ics(ev),'text/calendar');toast(`${ev.length} reminders ready for your calendar`)},
 icsCheckin:d=>{const g=G(d.id);closeSheet();const BY=['SU','MO','TU','WE','TH','FR','SA'];const dt=new Date();if(g.checkin==='weekly')while(dt.getDay()!==+g.checkinDay)dt.setDate(dt.getDate()+1);
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Plotline//EN','BEGIN:VEVENT','UID:ci-'+g.id+'@plotline','DTSTAMP:'+icsStamp(),'DTSTART:'+ymd(dt).replace(/-/g,'')+'T'+(g.checkinTime||'19:00').replace(':','')+'00','DURATION:PT15M','RRULE:FREQ='+(g.checkin==='daily'?'DAILY':'WEEKLY;BYDAY='+BY[+g.checkinDay]),'SUMMARY:'+icsEsc('Check in: '+g.title),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Check in: '+g.title),'TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'];
  download('plotline-checkin.ics',L.join('\r\n'),'text/calendar');toast('Open the file to add repeating check-ins')},
 goalMenu:d=>{const g=G(d.id);openSheet(`<div class="data">${areaName(g.area)}</div><h2 style="margin-top:8px">${esc(g.title)}</h2><div class="menu"><button data-act="newGoal" data-parent="${g.id}">${ic('plus')}Add a sub-goal</button><button data-act="toggleDone" data-id="${g.id}">${ic('flag')}${g.status==='done'?'Reopen goal':'Mark as achieved'}</button><button data-act="icsGoal" data-id="${g.id}">${ic('cal')}Add dated steps to calendar</button>${g.checkin?`<button data-act="icsCheckin" data-id="${g.id}">${ic('bell')}Add check-ins to calendar</button>`:''}<button data-act="connect" data-id="${g.id}">${ic('link')}Connect to other goals</button><button data-act="shareGoal" data-id="${g.id}">${ic('ext')}Share as a plan</button><button data-act="dupGoal" data-id="${g.id}">${ic('copy')}Duplicate as template</button><button class="danger" data-act="delGoal" data-id="${g.id}">${ic('trash')}Delete goal</button></div>`)},
 toggleDone:d=>{const g=G(d.id);closeSheet();if(g.status==='done'){g.status='active';g.completedAt=null;S.entries=S.entries.filter(e=>!(e.type==='goal-done'&&e.goalId===g.id));toast('Goal reopened')}else completeGoal(g);save();render(false)},
 dupGoal:d=>{const g=G(d.id);const n=newGoal({...g,title:g.title+' (copy)',steps:g.steps.map(s=>({title:s.title,note:s.note}))});S.goals.push(n);log('goal-new',n.id,n.title);closeSheet();save();go('goal/'+n.id);toast('Duplicated with fresh steps')},
 delGoal:d=>{const g=G(d.id);const nk=kids(g).length;askConfirm('Delete this goal?',`“${esc(g.title)}” and its steps will be removed.${nk?` Its ${nk} sub-goal${nk>1?'s move':' moves'} up a level.`:''} Journal moments stay.`,'Delete',()=>{const u=undoPoint();S.goals.forEach(x=>{x.links=x.links.filter(l=>l!==g.id);if(x.parent===g.id)x.parent=g.parent||''});S.goals=S.goals.filter(x=>x.id!==g.id);save();go('goals');toast('Goal deleted',u)})},
 connect:d=>{const g=G(d.id);const others=S.goals.filter(x=>x.id!==g.id);openSheet(`<h2>Connect goals</h2><p class="muted small">Which goals does “${esc(g.title)}” support or depend on?</p><form data-form="saveLinks" data-id="${g.id}"><div class="clist">${others.map(x=>`<label class="citem" style="${cvar(x)}"><input type="checkbox" name="l" value="${x.id}" ${g.links.includes(x.id)?'checked':''}><i></i><span>${esc(x.title)}</span><span class="data">${areaName(x.area)}</span></label>`).join('')||'<p class="muted">Create another goal first.</p>'}</div><div class="actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn pri">Save</button></div></form>`)},
 addEntry:d=>openSheet(momentForm(null,d.g)),
 editEntry:d=>{const e=S.entries.find(x=>x.id===d.id);if(e)openSheet(momentForm(e))},
 rmPhoto:()=>{PHOTO='';const p=$('#phPrev');if(p)p.hidden=true;$('#phLbl').textContent='Take or choose a photo'},
 delEntry:d=>{const u=undoPoint();S.entries=S.entries.filter(e=>e.id!==d.id);save();render(false);toast('Moment deleted',u)},
 timerPick:d=>{const g=G(d.g),s=g&&g.steps.find(x=>x.id===d.s);if(!s)return;openSheet(`<div class="data">Focus timer</div><h2 style="margin-top:8px">${esc(s.title)}</h2><p class="muted small">You’ll get a chime and a notification when it ends. The minutes are logged on this step.</p><div class="chips">${[5,10,15,25,45,60,90].map(m=>`<button class="chip" data-act="startTimer" data-g="${g.id}" data-s="${s.id}" data-m="${m}">${m} min</button>`).join('')}</div><div class="actions"><button class="btn ghost" data-act="close">Cancel</button></div>`)},
 startTimer:d=>startTimer(d.g,d.s,+d.m),
 stopTimer:()=>{S.settings.timer=null;save();$('#tpill').classList.remove('on');toast('Timer stopped')},
 addTime:()=>{if(S.settings.timer){S.settings.timer.end+=5*6e4;save();paintTimer()}},
 finishStep:d=>{closeSheet();const g=G(d.g),s=g&&g.steps.find(x=>x.id===d.s);if(s&&!s.done)ACT.toggleStep(d)},
 aiTab:d=>{if(AI.tab!==d.v){AI.tab=d.v;AI.reply='';AI.plan=null;AI.errs=[];AI.sel=new Set()}render(false)},
 copyPrompt:async()=>{const ch=AI.tab==='change';const t=ch?AI.change:AI.text;if(!t.trim())return toast(ch?'Describe what changed first':'Write a few lines about what you want first');if(ch&&!S.goals.length)return toast('No goals yet. Start with New plan');toast(await copyText(ch?updatePrompt(t):createPrompt(t))?'Prompt copied. Paste it into any AI':'Copy failed. Try again')},
 copySpec:async()=>toast(await copyText(SPEC(AI.tab==='change'?'update':'create'))?'Format copied':'Copy failed'),
 copyFix:async()=>toast(await copyText(fixPrompt())?'Fix-it message copied. Paste it into the same AI chat':'Copy failed'),
 parseAI:()=>{AI.reply=$('#aiReply').value;const mode=AI.tab==='change'?'update':'create';AI.plan=null;AI.errs=[];try{const o=extractPlan(AI.reply);const errs=validatePlan(o,mode);if(errs.length)AI.errs=errs;else{AI.plan=o;AI.sel=new Set(o.goals.map((x,i)=>x.action==='keep'?-1:i).filter(i=>i>=0));AI.main=null;if(mode==='create')aiMain(o)}}catch(e){AI.errs=e.errs||[String(e.message||e)]}render(false);setTimeout(()=>document.querySelector(AI.plan?'.pv':'.errbox')?.scrollIntoView({behavior:'smooth',block:'center'}),60)},
 pvToggle:(d,el)=>{el.checked?AI.sel.add(+d.i):AI.sel.delete(+d.i);render(false)},

  if(h.kind==='quit'){const v=h.mode==='limit'?lStreak(h)-1:qDays(h),L=h.mode==='limit'?SMILES:MILES,m=floorMile(L,v);if(m>(h.mile||0)){h.mile=m;ch=true;if(announce){won=[h,h.mode==='limit'?`${m} days under your limit`:`${mileName(m)} free`];S.entries.push({id:uid(),t:Date.now(),type:'habit',goalId:h.goalId||null,text:`${won[1]} · ${h.title}`,sid:null,img:null})}}else if(m<(h.mile||0)){h.mile=m;ch=true}return}
  const s=hStreak(h),L=h.freq==='times'?WMILES:SMILES,m=floorMile(L,s);
  if(m>(h.smile||0)){h.smile=m;ch=true;if(announce){const lab=h.freq==='times'?`${m}-week streak`:`${m}-day streak`;won=[h,lab];S.entries.push({id:uid(),t:Date.now(),type:'habit',goalId:h.goalId||null,text:`${lab} · ${h.title}`,sid:null,img:null})}}else if(m<(h.smile||0)){h.smile=m;ch=true}});
 if(won){burst();setTimeout(()=>toast(`${esc(hIcon(won[0]))} Milestone: ${esc(won[1])}`),350)}
 return won?2:ch?1:0}

function hChk(h){const td=ymd(),v=hVal(h,td),n=hTarget(h),dn=v>=n,rt=h.kind==='routine'&&h.steps.length;

function hWeek(h){const tn=dnum(ymd());let o='';for(let k=tn-6;k<=tn;k++){const ds=fromN(k),v=hVal(h,ds),n=hTarget(h);let c;
  if(ds<h.startDate)c='n';else if(h.skip[ds])c='s';else if(v>=n)c='d';else if(v>0)c='p';else if(!hDue(h,ds))c='n';else if(k===tn)c='t';else c=h.freq==='times'?'n':'x';
  o+=`<button class="hd ${c}" data-act="hDay" data-id="${h.id}" data-d="${ds}" aria-label="${dayName(ds)}: ${c==='d'?'done':c==='s'?'rest day':'not done'}"><i></i><em>${DAYS[dUTC(k).getUTCDay()][0]}</em></button>`}return`<div class="hweek">${o}</div>`}

  <div class="hq-lim"><b>${v}</b><span>of ${h.limit} today</span></div><div class="pbar"><i style="width:${Math.min(100,h.limit?v/h.limit*100:v?100:0)}%"></i></div><div class="data">${over?'Over the limit today · tomorrow is a fresh start':`${Math.max(0,h.limit-v)} left today`}${st?` · ${st} day${st>1?'s':''} on track`:''}</div>

 const since=qSince(h),d=Math.floor((now-since)/864e5),nx=MILES.find(m=>m>d)||d+365,pv=floorMile(MILES,d),f=(now-since-pv*864e5)/((nx-pv)*864e5),sv=qSaved(h);
 return`<article class="hq tint" style="${cvar(h)}" data-act="openHabit" data-id="${h.id}"><div class="hq-top"><span class="data">${h.slips.some(s=>s.t>=h.start)?'Since your last slip':'Free since '+fmtDate(ymd(new Date(since)))}</span><span class="hic sm">${esc(hIcon(h))}</span></div><h3>${esc(h.title)}</h3>
 <div class="hq-clock" data-since="${since}">${clockHTML(now-since)}</div><div class="pbar"><i style="width:${(f*100).toFixed(1)}%"></i></div><div class="data">Next milestone: ${mileName(nx)}${sv.money>=.5?' · '+money(h,sv.money)+' saved':sv.mins>=30?' · '+hrs(sv.mins)+' back':''}</div>
 <div class="hq-a"><button class="btn ink sm" data-act="urge" data-id="${h.id}">${ic('wave')}I have an urge</button><button class="btn inkline sm" data-act="slip" data-id="${h.id}">Log a slip</button></div></article>`}
function todayHabits(){const td=ymd();return S.habits.filter(h=>h.status==='active'&&h.kind!=='quit'&&hDue(h,td)).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:(a.createdAt||0)-(b.createdAt||0))}
function dayRatio(ds){let due=0,dn=0;S.habits.forEach(h=>{if(h.kind==='quit'||h.status==='archived'||!hDue(h,ds)||h.skip[ds])return;const d=hDone(h,ds);if(h.freq==='times'&&!d&&(ds!==ymd()||!hCounts(h,ds)))return;due++;if(d)dn++});return{due,dn}}
function perfectRun(){const tn=dnum(ymd()),ms=Math.min(tn,...S.habits.map(h=>dnum(h.startDate)));let n=0;for(let k=tn;k>=ms&&k>tn-800;k--){const r=dayRatio(fromN(k));if(!r.due)continue;if(r.dn>=r.due)n++;else if(k===tn)continue;else break}return n}
function hSummary(){const tn=dnum(ymd()),t=dayRatio(ymd()),f=t.due?t.dn/t.due:0;let bars='';
 for(let k=tn-6;k<=tn;k++){const r=dayRatio(fromN(k)),p=r.due?r.dn/r.due:0;bars+=`<div class="${k===tn?'now':''}"><i class="${p?'':'z'}" style="height:${Math.max(6,p*100)}%"></i><span>${DAYS[dUTC(k).getUTCDay()][0]}</span></div>`}
 const pr=perfectRun(),wk=[...Array(7)].map((_,i)=>dayRatio(fromN(tn-i))).reduce((a,r)=>({due:a.due+r.due,dn:a.dn+r.dn}),{due:0,dn:0});
 return`<section class="hsum rv"><div class="big" style="--c:var(--accent)">${hRing(f,104,9)}<b>${Math.round(f*100)}<small>%</small></b></div><div><div class="data">Today · ${t.dn} of ${t.due} done</div><div class="hbars">${bars}</div><div class="data" style="margin-top:10px">${wk.due?Math.round(wk.dn/wk.due*100)+'% kept this week':'This week'}${pr>1?` · ${pr} perfect days in a row`:''}</div></div></section>`}
function hNudge(){const yd=addDays(-1),td=ymd();const miss=S.habits.filter(h=>h.status==='active'&&h.kind!=='quit'&&h.freq!=='times'&&hDue(h,yd)&&!h.skip[yd]&&!hDone(h,yd)&&!hDone(h,td)&&hDue(h,td)&&yd>=h.startDate);if(!miss.length)return'';
 const m=miss.find(h=>h.mini);return`<div class="hnudge rv">${ic('flag')}<div><b>Missed yesterday: ${miss.slice(0,3).map(h=>esc(h.title)).join(', ')}${miss.length>3?' +'+(miss.length-3):''}</b><div class="small muted">Missing once is normal. Try not to miss twice.${m?` The small version counts: “${esc(m.mini)}”.`:''}</div></div></div>`}
function vHabits(){const all=S.habits.filter(h=>h.status!=='archived'),td=ymd(),t=dayRatio(td);

  const later=all.filter(h=>h.kind!=='quit'&&h.status==='active'&&!hDue(h,td));if(later.length)body+=`<section class="rv"><div class="st-h"><h3>Not today</h3></div><div class="chips">${later.map(h=>`<button class="chip" style="${cvar(h)}" data-act="openHabit" data-id="${h.id}">${esc(hIcon(h))} ${esc(h.title)} <span class="data">${esc(freqText(h))}</span></button>`).join('')}</div></section>`;

 if(URGE){const t=$('#urT');if(!t)URGE=null;else{const left=Math.max(0,URGE.end-now);t.textContent=left?`${Math.floor(left/6e4)}:${pad2(Math.floor(left%6e4/1e3))}`:'You rode it out';const ph=(now-URGE.t0)%10000,b=$('#brTxt');if(b)b.textContent=ph<4000?'Breathe in':ph<5500?'Hold':'Breathe out'}}
 if(LASTD!==ymd()){LASTD=ymd();if(!$('#sheet').classList.contains('on'))render(false);pushWidget();syncNative()}}
setInterval(paintLive,1000);
function habitWeekLine(){const tn=dnum(ymd());let due=0,dn=0;for(let k=tn-6;k<=tn;k++){const r=dayRatio(fromN(k));due+=r.due;dn+=r.dn}if(!due)return'';const best=S.habits.filter(h=>h.status==='active'&&h.kind!=='quit').map(h=>[h,hStreak(h)]).sort((a,b)=>b[1]-a[1])[0];return`Habits: ${Math.round(dn/due*100)}% kept this week${best&&best[1]>2?`, longest streak ${best[1]}${best[0].freq==='times'?' weeks':' days'} on ${best[0].title}`:''}.`}
function hCelebrate(h){const td=ymd(),t=dayRatio(td);if(t.due>1&&t.dn>=t.due){burst();toast('Every habit for today is done');return}const s=hStreak(h);if(s>1)toast(`${esc(hIcon(h))} ${esc(h.title)} · ${s}${h.freq==='times'?'-week':'-day'} streak`)}
/* widget + notification payload */
function widgetHabits(){const td=ymd(),tn=dnum(td),L=d=>{const o={};for(let k=tn-7;k<=tn;k++){const ds=fromN(k),v=hVal(d,ds);if(v)o[ds]=v;if(d.skip[ds])o[ds]=-1}return o};
 const hs=S.habits.filter(h=>h.status==='active'&&h.kind!=='quit').sort((a,b)=>HPARTS.findIndex(p=>p[0]===a.part)-HPARTS.findIndex(p=>p[0]===b.part)||(a.time||'99').localeCompare(b.time||'99')).slice(0,12).map(h=>{const s=hStreak(h);return{id:h.id,t:h.title,e:hIcon(h),a:areaOf(h.area).k,c:ACOL[areaOf(h.area).k]||'#FFB547',n:hTarget(h),u:h.unit||'',k:h.kind==='routine'&&h.steps.length?'routine':'build',m:[0,1,2,3,4,5,6].map(i=>h.freq!=='days'||h.days.includes(i)?'1':'0').join(''),sd:h.startDate,tw:h.freq==='times'?h.times:0,sb:h.freq==='times'?s:Math.max(0,s-(hDone(h,td)?1:0)),l:L(h)}});
 const qs=S.habits.filter(h=>h.status==='active'&&h.kind==='quit').slice(0,6).map(h=>{const sv=qSaved(h),d=qDays(h),nx=MILES.find(m=>m>d);return{id:h.id,t:h.title,e:hIcon(h),a:areaOf(h.area).k,c:ACOL[areaOf(h.area).k]||'#FFB547',mode:h.mode,since:qSince(h),best:qBest(h),saved:h.mode==='limit'?'':sv.money>=.5?money(h,sv.money)+' saved':sv.mins>=30?hrs(sv.mins)+' back':'',next:nx?mileName(nx):'',lim:h.limit,u:h.unit||'',l:L(h),ls:lStreak(h)}});
 return{hd:td,habits:hs,quits:qs}}
function habitAlarms(now,L){S.habits.forEach(h=>{if(h.status!=='active')return;
  if(h.kind!=='quit'&&h.remind&&h.time){const[hh,mm]=h.time.split(':').map(Number);for(let k=0;k<4;k++){const d=new Date();d.setDate(d.getDate()+k);d.setHours(hh,mm,0,0);const ds=ymd(d);if(d.getTime()<=now||!hCounts(h,ds)||hDone(h,ds))continue;const s=hStreak(h);
   L.push({at:d.getTime(),title:`${hIcon(h)} ${h.title}`,body:h.cue?h.cue:s>1?`Keep your ${s}${h.freq==='times'?'-week':'-day'} streak going`:h.mini?'Small version: '+h.mini:'Time for this habit',hid:h.kind==='build'?h.id:'',hd:ds,hv:hTarget(h)})}}
  if(h.kind==='quit'&&h.mode!=='limit'){const since=qSince(h),d=qDays(h),nx=MILES.find(m=>m>d);if(nx)L.push({at:since+nx*864e5,title:`🎉 ${mileName(nx)} free · ${h.title}`,body:'A new milestone. Open Plotline to see how far you’ve come.'})}})}
function habitTick(now,td){let ch=false;const d=new Date(),cm=d.getHours()*60+d.getMinutes(),R=S.settings.hRem||(S.settings.hRem={});
 S.habits.forEach(h=>{if(h.status!=='active'||h.kind==='quit'||!h.remind||!h.time)return;const[hh,mm]=h.time.split(':').map(Number);if(cm<hh*60+mm||cm>hh*60+mm+180||R[h.id]===td||!hCounts(h,td)||hDone(h,td))return;R[h.id]=td;ch=true;notify(`${hIcon(h)} ${h.title}`,h.cue||'Time for this habit')});
 if(checkMilestones())ch=true;return ch}

Object.assign(FORM,{

  const o={title,icon:fd.get('icon')||'',why:String(fd.get('why')||'').trim(),area:areaKey(fd.get('area'))||'personal',goalId:fd.get('goal')||''};
  if(kind!=='quit'){o.freq=fd.get('freq')||'daily';o.days=fd.getAll('days').map(Number);if(o.freq==='days'&&(!o.days.length||o.days.length===7)){o.freq='daily';o.days=[0,1,2,3,4,5,6]}o.times=+fd.get('times')||3;o.part=fd.get('part')||'any';o.time=fd.get('time')||'';o.remind=fd.get('remind')==='on'&&!!o.time}
  if(kind==='build'){o.cue=String(fd.get('cue')||'').trim();o.mini=String(fd.get('mini')||'').trim();o.target=Math.max(1,Math.min(999,+fd.get('target')||1));o.unit=String(fd.get('unit')||'').trim()}
  if(kind==='routine'){o.steps=parseSteps(fd.get('steps'),ex?ex.steps:[]);if(!o.steps.length)return toast('Add at least one step')}
  if(kind==='quit'){o.mode=fd.get('mode')==='limit'?'limit':'quit';o.limit=Math.max(0,+fd.get('limit')||0);o.unit=String(fd.get('lunit')||'').trim();o.plan=String(fd.get('plan')||'').trim();o.cost=Math.max(0,+fd.get('cost')||0);o.cur=String(fd.get('cur')||'$').trim()||'$';o.mins=Math.max(0,+fd.get('mins')||0);
   const st=fd.get('start');const t=st?new Date(st).getTime():NaN;if(o.mode==='quit'&&!isNaN(t)&&(!ex||st!==localDT(ex.start)))o.start=Math.min(Date.now(),t)}
  if(o.remind)askNotif();
  if(ex){if(ex.kind==='quit'&&o.start&&o.start!==ex.start){o.mile=0;if(ymd(new Date(o.start))<ex.startDate)o.startDate=ymd(new Date(o.start))}Object.assign(ex,o);checkMilestones(false);closeSheet();save();render(false);toast('Saved')}
  else{const h=normHabit({...o,kind,id:uid(),createdAt:Date.now(),startDate:o.start?ymd(new Date(o.start)):ymd()});checkMilestones(false);S.habits.push(h);h.smile=0;h.mile=h.kind==='quit'?floorMile(MILES,qDays(h)):0;HV='today';closeSheet();save();go('habit/'+h.id);toast(kind==='quit'?'Clock started. You’ve got this.':kind==='routine'?'Routine created':'Habit created')}},

  h.slips.push({t,trig:fd.get('trig')||'',note:String(fd.get('note')||'').trim()});h.mile=0;closeSheet();save();render(false);toast(`Clock restarted. Your best run is ${best} day${best===1?'':'s'}. You can beat it.`)},
